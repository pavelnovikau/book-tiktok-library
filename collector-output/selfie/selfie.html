d self","title":"The movement’s founders noticed its costs too","body":"<p>The later doubts of Maslow and Rogers disrupt a picture of unanimously confident gurus. Storr reports concerns about conceit, insufficient discipline and consequences of the practices. This internal criticism matters: the humanistic turn cannot be described only through its excesses, and caution did not always originate solely with external opponents.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"commercial-transformation","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Обещание трансформации становится тиражируемым товаром","body":"<p>Тренинги личного преображения переносят часть эсаленской риторики в более стандартизированный коммерческий формат. Сторр обсуждает ЭСТ Вернера Эрхарда и голод аудитории по переменам. Культурный результат шире отдельного семинара: человек получает привычку искать следующую технологию, которая наконец превратит его в правильную версию себя.<\/p>"},"en":{"section":"4 · The good self","title":"The promise of transformation becomes a repeatable product","body":"<p>Personal-transformation seminars carry some Esalen rhetoric into a more standardized commercial format. Storr discusses Werner Erhard’s est and audiences hungry for change. The cultural result exceeds any one seminar: people acquire the habit of searching for the next technique that will finally transform them into the right version of themselves.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"good-self-paradox","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Любовь к себе не снимает требования стать лучше","body":"<p>У Сторра «хорошее я» не завершает гонку совершенства. Теперь человек должен обнаружить, освободить и доказать свой необыкновенный потенциал. Осуждение меняет язык: вместо греха появляется недостаточная аутентичность или вера в себя. Следующий шаг — превратить эту психологическую надежду в публичную политику и массовую норму.<\/p>"},"en":{"section":"4 · The good self","title":"Self-love does not necessarily remove the demand to improve","body":"<p>In Storr’s account, the good self does not end the race for perfection. People must now discover, liberate and prove their extraordinary potential. Condemnation changes vocabulary: insufficient authenticity or self-belief replaces sin. The next step is turning this psychological hope into public policy and a widespread social expectation.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"special-self-alliance","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Освобождение личности соединяется с требованием побеждать","body":"<p>В пятой части Сторр соединяет два потока: терапевтическое обещание внутреннего потенциала и экономическую культуру конкурирующего индивида. Их союз делает уверенность в себе почти гражданской обязанностью. Это авторская историческая конструкция: близость идей и влиятельных людей ещё не доказывает, что один центр заранее спланировал культурный результат.<\/p>"},"en":{"section":"5 · The special self","title":"Individual liberation meets the demand to win","body":"<p>In part five, Storr connects two currents: the therapeutic promise of inner potential and an economic culture of competing individuals. Together they make self-belief resemble a civic duty. This is the author’s historical construction; proximity between ideas and influential people does not establish that one centre deliberately planned the cultural outcome.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"rand-hero","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Айн Рэнд превращает независимого создателя в морального героя","body":"<p>У Сторра Рэнд играет роль культурного усилителя: её герои отказываются жить ради чужих требований, доверяют разуму и защищают собственное дело. Такая история делает предпринимательскую самостоятельность этическим образцом. Сторр критикует её последствия, но показывает и привлекательность свободы от принудительного подчинения группе.<\/p>"},"en":{"section":"5 · The special self","title":"Ayn Rand makes the independent creator a moral hero","body":"<p>For Storr, Rand amplifies a cultural ideal: her heroes reject other people’s demands, trust reason and defend their own work. The story makes entrepreneurial independence an ethical model. He criticizes its consequences while also showing the appeal of freedom from compulsory submission to a group and the claims it makes on individuals.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"branden-bridge","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Бранден переносит самооценку из философии в психологическую практику","body":"<p>Натаниэль Бранден связывает самоуважение с эффективностью и личным интересом, распространяя идеи за пределы читателей Рэнд. В книге он становится мостом к школам, терапии и движению самооценки. Это важное звено влияния, но не означает тождества философии Рэнд, всех подходов к самооценке и последующей государственной программы.<\/p>"},"en":{"section":"5 · The special self","title":"Branden carries self-esteem from philosophy into psychological practice","body":"<p>Nathaniel Branden connects self-respect with efficacy and self-interest, spreading the ideas beyond Rand’s readers. In the book he becomes a bridge to schools, therapy and the self-esteem movement. This channel of influence does not make Rand’s philosophy, every approach to self-esteem and the subsequent government programme identical projects.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"great-compression","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Послевоенный порядок тоже создавал свой тип человека","body":"<p>До поворота к жёсткой конкуренции Сторр описывает эпоху «Великой компрессии»: более коллективные экономические ожидания и жизнь внутри крупных организаций. Она тоже требовала определённой личности — общительной и пригодной к сотрудничеству. Книга прослеживает смену акцентов, а не падение из общества, где культурного давления вовсе не было.<\/p>"},"en":{"section":"5 · The special self","title":"The postwar order produced its own preferred person","body":"<p>Before the turn toward sharper competition, Storr describes the Great Compression: more collective economic expectations and lives within large organizations. That order also demanded a particular personality, sociable and suited to cooperation. The book traces changing emphases, not a fall from a society that had no cultural pressure at all.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"neoliberal-person","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Рынок становится моделью оценки самого человека","body":"<p>В книге неолиберальный поворот означает не только экономические решения. Он поддерживает человека, который постоянно конкурирует, инвестирует в себя и отвечает за результат. Сторра интересует перенос правил игры внутрь самооценки: недостаток дохода или популярности начинает выглядеть как свидетельство недостаточной человеческой пригодности.<\/p>"},"en":{"section":"5 · The special self","title":"The market becomes a model for evaluating the person","body":"<p>In the book, the neoliberal turn means more than economic policies. It favours a person who competes continually, invests in the self and answers for results. Storr follows those rules into self-evaluation: insufficient income or popularity starts to look like evidence of insufficient human adequacy rather than simply an outcome requiring explanation.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"hayek-state","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Конкурентный порядок не означает исчезновения государства","body":"<p>Сторр описывает Хайека, Тэтчер, Рейгана и распространение рыночной логики. Государство в этой истории не просто уходит: оно помогает устанавливать и охранять конкурентные правила. Такое уточнение важно, потому что влияние экономики на «я» идёт через институты и стимулы, а не через одно абстрактное слово «свобода».<\/p>"},"en":{"section":"5 · The special self","title":"A competitive order does not mean the state disappears","body":"<p>Storr discusses Hayek, Thatcher, Reagan and the spread of market reasoning. In this account, the state does not merely retreat; it helps establish and protect competitive rules. The distinction matters because economic influence on the self operates through institutions and incentives, not through the abstract word freedom acting on its own.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"vasco-personal-turn","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Васконселлос превращает личное облегчение в общественную миссию","body":"<p>Джон Васконселлос, переживавший гнев и депрессию, находит надежду в гуманистической психологии. Сторр прослеживает, как убеждение, важное для личной биографии политика, становится программой для общества. Здесь снова возникает переход масштаба: помощь одному человеку не доказывает, что тот же принцип устранит преступность, бедность и школьные трудности.<\/p>"},"en":{"section":"5 · The special self","title":"Vasconcellos turns personal relief into a public mission","body":"<p>John Vasconcellos, struggling with anger and depression, finds hope in humanistic psychology. Storr follows a belief important to the politician’s biography as it becomes a programme for society. The scale changes again: something helpful to one person does not establish that the same principle will eliminate crime, poverty and educational problems.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"task-force-promise","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Калифорнийская группа обещает лечить социальные беды самооценкой","body":"<p>Васконселлос добивается государственной поддержки целевой группы. Обещание привлекательно своей простотой: повысить самооценку — и ослабить множество социальных проблем сразу. Книга показывает не только энтузиазм сторонников, но и политическую задачу доказать, что психологическая программа действительно оправдывает участие государства и расходы на неё.<\/p>"},"en":{"section":"5 · The special self","title":"California’s task force promises self-esteem as a social remedy","body":"<p>Vasconcellos obtains government support for a task force. Its promise is attractively simple: raise self-esteem and reduce many social problems at once. The book describes supporters’ enthusiasm alongside the political task of establishing that a psychological programme genuinely justifies government involvement and the resources being spent on promoting it.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"smelser-research","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Университетская проверка не дала обещанного причинного ответа","body":"<p>Учёные под руководством Нила Смелзера находят неоднородные связи, но не подтверждают простой тезис о низкой самооценке как причине социальных бед. Сторр сопоставляет научную осторожность с оптимистичной публичной подачей. В его расследовании важна именно разница между тем, что проверили, и тем, что объявили подтверждённым.<\/p>"},"en":{"section":"5 · The special self","title":"University research did not supply the promised causal answer","body":"<p>Researchers coordinated by Neil Smelser find uneven relationships without establishing the simple claim that low self-esteem causes social problems. Storr compares scientific caution with the optimistic public presentation. His investigation centres on the difference between what researchers examined and what campaigners subsequently announced as scientifically confirmed, rather than the mere presence of a university endorsement.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"causal-shortcut","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Совпадение самооценки и успеха не доказывает способ получить успех","body":"<p>Успех может укреплять самооценку; третьи условия могут влиять на оба показателя. Поэтому связь между ними не доказывает, что искусственное повышение одного вызовет другое. Для Сторра это центральная ошибка движения: привлекательное объяснение было превращено в рецепт до достаточной проверки самого вмешательства.<\/p>"},"en":{"section":"5 · The special self","title":"Self-esteem accompanying success does not establish a route to success","body":"<p>Success may strengthen self-esteem, while other conditions may affect both. Their association therefore does not establish that artificially increasing one will produce the other. For Storr this is the movement’s central mistake: an attractive explanation became a prescription before the intervention itself had been adequately tested against its promised social outcomes.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"archive-reporting","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Сторр противопоставляет кампанию её собственным документам","body":"<p>Его расследование опирается на отчёты, записи заседаний и поздние разговоры с участниками. Так он обосновывает тезис о скрытой неопределённости и тщательно организованном публичном успехе. Конспект передаёт это как журналистское установление автора: исходные архивные плёнки и воспоминания участников здесь независимо заново не проверялись.<\/p>"},"en":{"section":"5 · The special self","title":"Storr sets the campaign against its own documentary record","body":"<p>His investigation uses reports, meeting recordings and later conversations with participants to argue that uncertainty was concealed behind a carefully managed public success. This digest attributes that finding to Storr’s reporting. The original archive tapes and participants’ recollections have not been independently re-examined here, and attribution is essential to preserving that evidence boundary.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"research-2003","level":2,"claimType":"corroboration","sources":[6],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Обзор 2003 года ограничил многие обещания движения","body":"<p>Баумайстер и коллеги не нашли сильной опоры для многих обещаний причинной пользы высокой самооценки, особенно для успеваемости. При этом они сохраняли положительные выводы о некоторых чувствах и инициировании действий. Критика универсального средства не равна выводу, что человеку полезно плохо к себе относиться.<\/p>"},"en":{"section":"5 · The special self","title":"The 2003 review narrowed many promises of the movement","body":"<p>Baumeister and colleagues found weak support for many promised causal benefits of high self-esteem, particularly academic performance. They nevertheless retained positive conclusions about some feelings and initiative. Criticizing a universal remedy is not equivalent to concluding that people benefit from disliking themselves or should be deliberately given lower self-worth.<\/p>"}}},{"id":"later-review","level":1,"claimType":"corroboration","sources":[7],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Позднейший обзор не позволяет объявить самооценку бесполезной","body":"<p>Орт и Робинс в 2022 году оценили более поздние данные и нашли небольшие полезные эффекты самооценки в нескольких жизненных областях. Это уточнение после книги. Оно усиливает различие между нормальным чувством собственной ценности, нарциссическим превосходством и доказательствами пользы конкретной программы искусственной похвалы.<\/p>"},"en":{"section":"5 · The special self","title":"A later review prevents dismissing self-esteem as useless","body":"<p>In 2022, Orth and Robins reviewed later evidence and found small beneficial effects of self-esteem across several life domains. This is a post-book qualification. It reinforces the distinction between ordinary self-worth, narcissistic superiority and evidence that a particular programme of indiscriminate praise actually delivers the outcomes promised for it.<\/p>"}}},{"id":"sociometer","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Самооценка в книге работает как социальный индикатор","body":"<p>Сторр обсуждает социометрическую модель: самооценка чувствительна к сигналам принятия и ценности для других. В таком понимании простое раздувание показателя может не улучшать реальные отношения. Аналогия с индикатором полезна, но это теоретическая модель функций самооценки, а не доказательство бесполезности поддержки или любой работы с убеждениями.<\/p>"},"en":{"section":"5 · The special self","title":"In the book, self-esteem acts as a social indicator","body":"<p>Storr discusses a sociometer account: self-esteem responds to signals of acceptance and value to others. Inflating the indicator alone may not improve actual relationships. The analogy is useful, but it remains a theoretical model of self-esteem’s functions, not proof that emotional support or all work on personal beliefs is useless.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"narcissism-not-esteem","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Нарциссизм и высокая самооценка — разные вещи","body":"<p>В описанном Сторром исследовании агрессию лучше объяснял нарциссизм, чем просто высокий уровень самооценки. Отличие существенно: спокойно считать себя достойным уважения — не то же самое, что требовать особого обращения и болезненно защищать превосходство. Смешение этих понятий сделало бы вывод книги грубее её собственных данных.<\/p><div class=\"compare\"><div class=\"compare-item\"><strong>Чувство ценности<\/strong><p>Я заслуживаю уважения вместе с другими.<\/p><\/div><div class=\"compare-item\"><strong>Превосходство<\/strong><p>Мне должны особое обращение и подтверждение.<\/p><\/div><\/div>"},"en":{"section":"5 · The special self","title":"Narcissism and high self-esteem are different things","body":"<p>In the research Storr describes, narcissism explained aggression better than high self-esteem alone. The distinction matters: calmly regarding oneself as worthy of respect differs from demanding special treatment and defensively protecting superiority. Conflating the concepts would make the book’s conclusion cruder than the evidence it actually discusses.<\/p><div class=\"compare\"><div class=\"compare-item\"><strong>Self-worth<\/strong><p>I deserve respect alongside other people.<\/p><\/div><div class=\"compare-item\"><strong>Superiority<\/strong><p>I am owed special treatment and confirmation.<\/p><\/div><\/div>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"narcissistic-injury","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Угроза исключительности может провоцировать защитную агрессию","body":"<p>Уязвимость возникает, когда образ превосходства требует постоянного подтверждения. Оскорбление тогда переживается не как отдельная неприятность, а как покушение на основу личности. Сторр использует эту логику для объяснения поведения, но она не позволяет ставить диагноз по одной сердитой реакции или объявлять всякого уверенного человека опасным.<\/p>"},"en":{"section":"5 · The special self","title":"Threatened exceptionalism can provoke defensive aggression","body":"<p>Vulnerability arises when a superior self-image requires continual confirmation. An insult then feels less like a particular unpleasant event than an attack on the foundation of identity. Storr uses this mechanism to interpret behaviour. It does not justify diagnosing someone from one angry reaction or treating every confident person as dangerous.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"narcissism-trend-dispute","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Спор о росте нарциссизма нельзя вычеркнуть из книги","body":"<p>Твендж и Кэмпбелл видят поколенческий рост нарциссизма; Сторр приводит и возражения Тржесневски о выборках и измерениях, и ответы сторонников роста. Поэтому «эпидемия» здесь — спорная интерпретация исследований. Особенно важно не превращать изменение средних баллов опросника в клинический диагноз целому поколению.<\/p>"},"en":{"section":"5 · The special self","title":"The dispute over rising narcissism belongs inside the argument","body":"<p>Twenge and Campbell argue for rising narcissism across generations. Storr includes Trzesniewski’s objections about samples and measurement, as well as the proponents’ replies. The epidemic framing therefore represents a disputed interpretation. Changes in questionnaire averages should especially not be converted into a clinical diagnosis of an entire generation.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"praise-versus-warmth","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Тёплое отношение не требует убеждать ребёнка в превосходстве","body":"<p>Сторр обсуждает исследование родительской переоценки: ребёнка можно любить, не внушая ему исключительность по сравнению с другими. Это различие защищает важную оговорку. Критика чрезмерной похвалы не даёт основания отказывать детям в тепле, унижать их или требовать достижений как платы за человеческую ценность.<\/p>"},"en":{"section":"5 · The special self","title":"Warmth does not require telling children they are superior","body":"<p>Storr discusses research into parental overvaluation: children can be loved without being taught that they are superior to others. The distinction protects an important qualification. Criticizing excessive praise provides no basis for withholding warmth, humiliating children or making achievement the price they must pay for being regarded as valuable human beings.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"vasco-counterfactual","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Один политик не объясняет всю культурную перемену","body":"<p>Сторр сам спрашивает, что произошло бы и без Васконселлоса: индивидуализм и вера в особенное «я» росли по другим каналам. Целевая группа важна как усилитель и источник легитимности. Она не достаточное объяснение глобального сдвига, а её отсутствие не означает автоматически мир без подобных ожиданий.<\/p>"},"en":{"section":"5 · The special self","title":"One politician cannot explain the entire cultural shift","body":"<p>Storr asks what would have happened without Vasconcellos: individualism and belief in a special self were spreading through other channels. The task force mattered as an amplifier and source of legitimacy. It is not a sufficient explanation for a global shift, nor would its absence automatically produce a world without these expectations.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"market-benefits","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Свобода и инновации остаются частью неоднозначного результата","body":"<p>Сторр прямо отказывается описывать неолиберализм как злодея без достоинств: он признаёт положительные результаты и сложность экономических перемен. Его критический вопрос — как распределяются выгоды и риски. История о победителях становится опасной, когда заслоняет условия соревнования и превращает положение проигравших в доказательство их неполноценности.<\/p>"},"en":{"section":"5 · The special self","title":"Freedom and innovation remain part of an ambiguous outcome","body":"<p>Storr explicitly resists portraying neoliberalism as a villain without redeeming features, acknowledging benefits and the complexity of economic change. His critical question concerns the distribution of gains and risks. Stories about winners become dangerous when they hide the conditions of competition and turn losers’ positions into proof of personal inadequacy.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"unequal-game","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"5 · Особенное «я»","title":"Неравные условия нельзя исправить одним правильным «я»","body":"<p>Долги, нестабильная занятость и различия возможностей образуют в книге материальный фон личной тревоги. Даже полезная уверенность не отменяет этих условий. Сторр связывает психологическую и общественную критику: нельзя обещать, что каждый станет победителем, а затем возлагать на отдельного человека всю вину за исход неравной игры.<\/p>"},"en":{"section":"5 · The special self","title":"Unequal conditions cannot be repaired through the right self alone","body":"<p>Debt, insecure work and unequal opportunities form the material background to personal anxiety in the book. Even useful confidence cannot abolish those conditions. Storr joins psychological and social criticism: society cannot promise that everyone will become a winner and then place all blame for the outcome of an unequal game on each individual.<\/p>"}},"bookLocation":"OPS/ch1-13.xhtml–ch1-16.xhtml; книга 5"},{"id":"digital-inheritance","level":1,"claimType":"book","sources":[1,3],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Цифровая культура наследует мечту об освобождённом индивиде","body":"<p>Для Сторра цифровое «я» не возникает с фронтальной камерой. Персональные компьютеры, контркультура и идеи человеческого потенциала заранее соединяют технологии с освобождением личности. Социальные платформы усиливают эту старую культурную программу. Такая генеалогия объясняет язык обещаний, но не означает, что каждое технологическое последствие было заранее задумано.<\/p>"},"en":{"section":"6 · The digital self","title":"Digital culture inherits the dream of the liberated individual","body":"<p>For Storr, the digital self does not begin with the front-facing camera. Personal computing, counterculture and human-potential ideas had already connected technology with individual liberation. Social platforms intensify that older programme. This genealogy explains the language of promises without implying that every technological consequence was intended in advance.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"engelbart-augmentation","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Энгельбарт проектирует усиление человеческой работы","body":"<p>Демонстрация Дага Энгельбарта 1968 года вводит в рассказ компьютер как средство расширить возможности людей, работающих с информацией. Сторр подчёркивает коллективный и организационный контекст этого видения. Позднейший образ одинокого гения или персонального самоусиления не должен стирать сотрудничество, необходимое для появления самой технологии.<\/p>"},"en":{"section":"6 · The digital self","title":"Engelbart designs the augmentation of human work","body":"<p>Doug Engelbart’s 1968 demonstration introduces computing as a way to extend the capacities of people working with information. Storr emphasizes the collective and organizational setting of that vision. Later images of the solitary genius or personal self-augmentation should not erase the collaboration required to bring the technology itself into existence.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"therapy-meets-lab","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Мечта о развитии человека проникает в технологическую лабораторию","body":"<p>Книга описывает встречи и эксперименты с личностным развитием в окружении Энгельбарта, включая конфликты и уход сотрудников. Это показывает реальное пересечение социальных сетей идей. Однако из близости терапии и инженерии не следует, что технические достижения зависят от спорных практик или что такие практики объясняют всю Кремниевую долину.<\/p>"},"en":{"section":"6 · The digital self","title":"Human-development ideals enter the technology laboratory","body":"<p>The book describes personal-development meetings and experiments around Engelbart, including conflict and departures. They show an actual intersection of intellectual and social networks. That overlap does not establish that technical achievements depended on controversial practices, or that those practices explain the whole culture and subsequent development of Silicon Valley.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"brand-network","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Стюарт Бранд соединяет инструменты, контркультуру и сети","body":"<p>От Whole Earth Catalog к сетевым сообществам и консультированию Бранд становится у Сторра важным посредником. Индивидуальный доступ к инструментам обещает обойти старые иерархии. Парадокс в том, что антиавторитарный язык легко сосуществует с рынком, который тоже обещает координацию без единого управляющего центра.<\/p>"},"en":{"section":"6 · The digital self","title":"Stewart Brand connects tools, counterculture and networks","body":"<p>From the Whole Earth Catalog to networked communities and consulting, Brand becomes an important intermediary in Storr’s account. Individual access to tools promises a route around old hierarchies. The paradox is that anti-authoritarian language can coexist with a market ideal that also promises coordination without a single directing centre.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"tech-utopianism","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Технологический оптимизм склонен забывать ограничения","body":"<p>Сторр прослеживает обещания сетевого процветания и освобождения, сопоставляя их с последующими провалами. Этот контраст не опровергает полезность интернета. Он показывает повторяющийся культурный жест: новую среду объявляют местом, где прежние человеческие ограничения наконец исчезнут, прежде чем внимательно проверить распределение её возможностей и издержек.<\/p>"},"en":{"section":"6 · The digital self","title":"Technological optimism can forget its own limits","body":"<p>Storr follows promises of networked prosperity and liberation alongside later disappointments. The contrast does not refute the internet’s usefulness. It reveals a recurring cultural move: declaring a new environment the place where old human limits will disappear before examining carefully how its opportunities and costs are actually distributed among different people.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"scored-self","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Платформа делает репутацию видимой и подсчитываемой","body":"<p>Лайки, подписчики и комментарии превращают социальное одобрение в постоянно обновляемые показатели. Сторр видит здесь древнюю борьбу за место в группе на новой технической поверхности. Образ себя становится участником соревнования: его можно редактировать, показывать, сравнивать и оценивать быстрее и публичнее, чем прежде.<\/p>"},"en":{"section":"6 · The digital self","title":"The platform makes reputation visible and countable","body":"<p>Likes, followers and comments turn social approval into continually updated scores. Storr sees an ancient struggle for position within a group operating on a new technical surface. A self-image becomes a contestant: it can be edited, displayed, compared and evaluated more quickly and publicly than before, with feedback that invites further monitoring.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"rainbow-mansion","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Коммуна показывает и идеал, и привлекательных живых людей","body":"<p>В Rainbow Mansion Сторр встречает амбициозных технарей, стремящихся менять мир. Он одновременно критикует культ предпринимателя и испытывает симпатию к собеседникам. Эта двойственность важна: книга не утверждает, что все люди, поверившие в технологический прогресс, эгоистичны или что их проекты не способны принести пользу.<\/p>"},"en":{"section":"6 · The digital self","title":"The commune reveals both an ideal and appealing human beings","body":"<p>At Rainbow Mansion, Storr meets ambitious technologists trying to change the world. He criticizes the entrepreneurial ideal while also liking the people he encounters. That ambivalence matters: the book does not claim that everyone who believes in technological progress is selfish, or that their projects cannot produce useful and admirable results.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"founder-template","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Стартап-среда задаёт локальную версию идеального человека","body":"<p>Общий культурный образ успеха уточняется внутри каждой среды. Для предпринимателя это может быть уверенный, энергичный, технически одарённый и убедительный основатель. Сторр показывает, как достоинства такой модели превращаются в фильтр: талантливый человек с другими социальными свойствами рискует счесть себя неподходящим целиком, а не для конкретной роли.<\/p>"},"en":{"section":"6 · The digital self","title":"Start-up culture supplies a local version of the ideal person","body":"<p>The general cultural image of success becomes more specific within each environment. For an entrepreneur, it may mean a confident, energetic, technically gifted and persuasive founder. Storr shows the model becoming a filter: talented people with different social qualities risk feeling wholly inadequate rather than mismatched to a particular role or situation.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"cj-extreme-case","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Си-Джей — крайний случай, а не портрет поколения","body":"<p>Сторр беседует с Си-Джей о славе, внешности, селфи и отношениях. Её история делает погоню за вниманием конкретной, но автор прямо признаёт её нетипичность. Баллы опросника и самоописания собеседницы нельзя превращать в клинический диагноз или оценку распространённости такого поведения среди всех молодых людей.<\/p>"},"en":{"section":"6 · The digital self","title":"CJ is an extreme case, not a portrait of a generation","body":"<p>Storr interviews CJ about fame, appearance, selfies and relationships. Her story makes the pursuit of attention concrete, but he explicitly acknowledges that she is an extreme case. Questionnaire scores and her self-description cannot be turned into a clinical diagnosis or an estimate of how common this behaviour is among young people.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"approval-dependence","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Проблемой становится зависимость от непрерывного подтверждения","body":"<p>Желание получить приятную реакцию само по себе не объявляется патологией. Опасность в книге возникает, когда одобрение необходимо всё время: его исчезновение переживается как падение ценности собственного «я». Тогда публикация и проверка отклика могут стать способом временно заглушать тревогу, постоянно создающим потребность в следующем подтверждении.<\/p>"},"en":{"section":"6 · The digital self","title":"The problem becomes dependence on continuous confirmation","body":"<p>Wanting a pleasant response is not treated as inherently pathological. The danger in the book arises when approval is needed continuously and its disappearance feels like a loss of personal worth. Posting and checking reactions can then become a way of briefly quieting anxiety while renewing the need for the next confirmation.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"facebook-bounded-evidence","level":3,"claimType":"corroboration","sources":[8],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Данные о Facebook поддерживают осторожный вывод о самочувствии","body":"<p>Кросс и коллеги в 2013 году опрашивали молодых взрослых пять раз в день две недели. Более активное использование Facebook предсказывало последующее ухудшение самочувствия и удовлетворённости жизнью. Временная последовательность полезна, но наблюдение не равно случайному назначению: это не универсальный причинный эффект всех платформ на каждого пользователя.<\/p>"},"en":{"section":"6 · The digital self","title":"Facebook evidence supports a cautious conclusion about well-being","body":"<p>In 2013, Kross and colleagues prompted young adults five times daily for two weeks. Greater Facebook use predicted later declines in feelings and life satisfaction. Temporal ordering is informative, but observation is not random assignment. The finding cannot establish a universal causal effect of every platform on every user.<\/p>"}}},{"id":"shaming-tribe","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Публичное наказание делает ошибку угрозой всей личности","body":"<p>Сторр связывает сетевое возмущение с давними механизмами репутации и наказания нарушителей. Масштаб аудитории и скорость реакции усиливают угрозу. При этом критика поступка, требование ответственности и травля не одно и то же: из опасности жестокого наказания не следует запрет обсуждать реальный вред.<\/p>"},"en":{"section":"6 · The digital self","title":"Public punishment makes a mistake threaten the whole identity","body":"<p>Storr connects online outrage with older mechanisms of reputation and punishment. Audience size and reaction speed amplify the threat. Criticism, accountability and harassment are not identical, however. Recognizing the danger of cruel punishment does not imply that people must be shielded from discussion of genuine harm they have caused.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"sacred-feelings-hypothesis","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Толкование непереносимости несогласия остаётся гипотезой автора","body":"<p>Сторр предполагает связь между сакрализацией собственного «я», нарциссизмом и стремлением наказывать несогласных. Его примеры из кампусов и сетевой политики не устанавливают единую причину. Важно сохранить слово «предполагает»: протест может иметь разные мотивы, а защита достоинства не автоматически свидетельствует о нарциссизме.<\/p>"},"en":{"section":"6 · The digital self","title":"The account of intolerance remains the author’s hypothesis","body":"<p>Storr proposes a connection between sacralizing the self, narcissism and attempts to punish disagreement. His campus and online political examples do not establish a single cause. The word proposes matters: protests can have different motives, and defending dignity is not automatically evidence of narcissism or an inability to tolerate reasonable disagreement.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"mixed-generation","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"6 · Цифровое «я»","title":"Цифровое поколение не сводится к утрате эмпатии","body":"<p>Сторр упоминает и положительные черты молодых людей: заботу о здоровье и внимание к структурному неравенству. Он признаёт неопределённость причин этих перемен. Цифровая среда усиливает сравнение и наказание, но книга не позволяет вывести из этого, что всё поколение стало хуже или что всякое стремление улучшиться вредно.<\/p>"},"en":{"section":"6 · The digital self","title":"The digital generation is not reducible to lost empathy","body":"<p>Storr also notes positive features among young people, including attention to health and structural inequality, while acknowledging uncertainty about their causes. Digital environments intensify comparison and punishment. The book does not therefore establish that an entire generation has become worse, or that every effort to improve oneself is harmful or futile.<\/p>"}},"bookLocation":"OPS/ch1-17.xhtml–ch1-19.xhtml; книга 6"},{"id":"austen-heinz","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"История Остина Хайнца показывает цену среды без права на ошибку","body":"<p>В финальной части Сторр рассказывает о предпринимателе Остине Хайнце, его трудностях и жестоком медийном обращении с ним. Это возвращает исследование к человеческой цене идеала. Автор связывает уязвимость личности со средой, но сама история не даёт права свести смерть к одному заголовку, характеру или публичному конфликту.<\/p>"},"en":{"section":"7 · How to survive","title":"Austen Heinz’s story shows the cost of an unforgiving environment","body":"<p>In the final part, Storr describes entrepreneur Austen Heinz, his difficulties and harsh media treatment. The story returns the inquiry to the human cost of the ideal. The author connects personal vulnerability with environment, but the case does not justify reducing a death to one headline, character trait or public dispute.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"diagnostic-disagreement","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Даже биографический диагноз требует проверки и оговорок","body":"<p>Сторр сохраняет несогласие семьи Хайнца с публичным предположением о биполярном расстройстве. Сестра ссылается на иной установленный диагноз. Это важная дисциплина рассказа: нельзя собирать удобное объяснение из слухов о психическом здоровье, а клиническую неопределённость нельзя устранять ради более стройного культурного сюжета.<\/p>"},"en":{"section":"7 · How to survive","title":"Even a biographical diagnosis requires checking and qualification","body":"<p>Storr preserves the family’s disagreement with public suggestions of bipolar disorder. Heinz’s sister points to a different documented diagnosis. This matters for narrative discipline: rumours about mental health should not be assembled into a convenient explanation, and clinical uncertainty should not be removed to produce a tidier cultural story.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"big-five-dimensions","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Черты личности — измерения, а не пять коробок","body":"<p>Открытость опыту, добросовестность, экстраверсия, доброжелательность и невротизм помогают описать относительно устойчивые различия. Сторр подчёркивает: это не выключатели и не отдельные типы людей. Сочетания выраженности черт влияют на то, какие ситуации даются легче, но опросник не исчерпывает человека и не предсказывает каждое его действие.<\/p>"},"en":{"section":"7 · How to survive","title":"Personality traits are dimensions, not five boxes","body":"<p>Openness, conscientiousness, extraversion, agreeableness and neuroticism describe relatively stable differences. Storr emphasizes that these are not switches or separate kinds of people. Combinations of trait levels affect which situations feel easier. A questionnaire does not exhaustively describe a person or predict every action they will take in every setting.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"change-with-limits","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Устойчивость личности не означает невозможность изменений","body":"<p>Сторр прямо признаёт взросление, обучение, воздействие переживаний и возможность изменений при психотерапии. Его спор направлен против безграничного самопересоздания, а не против развития. Важное различие: освоить навык, изменить привычку или уменьшить страдание — не то же самое, что по желанию стать человеком с любым набором свойств.<\/p>"},"en":{"section":"7 · How to survive","title":"Personality stability does not make change impossible","body":"<p>Storr explicitly acknowledges maturation, learning, effects of experience and possible changes through psychotherapy. His target is unlimited self-reinvention, not development itself. Learning a skill, changing a habit or reducing distress differs from becoming, at will, a person with any desired combination of characteristics and responses to the world.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"heritability-boundary","level":3,"claimType":"synthesis","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Наследуемость не задаёт личную судьбу","body":"<p>Книга придаёт большое значение биологическим различиям и исследованиям близнецов. Нужна граница вывода: сходство в изученной популяции не доказывает неизменность конкретного человека. Даже слабое влияние общей семейной среды на измеряемые черты не означает отсутствия последствий заботы, насилия, образования или материальных условий.<\/p>"},"en":{"section":"7 · How to survive","title":"Heritability is not predestination of an individual life","body":"<p>The book gives substantial weight to biological differences and twin studies. An inference boundary matters: resemblance within a studied population does not establish an individual’s immutability. Even limited shared-family effects on measured traits would not mean that care, abuse, education or material conditions have no consequences for a person’s life.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"person-environment-loop","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Личность выбирает среду, а среда усиливает привычки","body":"<p>Сторр описывает взаимную петлю: склонности влияют на выбор занятий и людей, а их отклик закрепляет особенности поведения. Общительный человек чаще получает приглашения и больше практики общения. Это не замкнутая судьба, но объяснение, почему небольшие исходные различия способны накапливаться в заметно разные жизненные траектории.<\/p>"},"en":{"section":"7 · How to survive","title":"Personality selects environments that reinforce its tendencies","body":"<p>Storr describes a reciprocal loop: tendencies influence which activities and people we choose, and their responses reinforce those tendencies. An outgoing person receives more invitations and gains more social practice. This is not a sealed destiny, but an account of how small initial differences can accumulate into substantially different life paths.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"acceptance-accountability","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Принять ограничения — не значит освободить себя от ответственности","body":"<p>Финальный совет Сторра — спокойнее понимать свои устойчивые особенности и перестать считать их доказательством испорченности. При этом он отвергает грубое оправдание «я такой»: если черты причиняют вред другим, нужно смягчать последствия и извиняться. Принятие отличается и от самолюбования, и от капитуляции перед любым собственным импульсом.<\/p>"},"en":{"section":"7 · How to survive","title":"Accepting limits does not remove responsibility","body":"<p>Storr’s concluding advice is to understand relatively stable characteristics more calmly rather than treat them as proof of defectiveness. He rejects the crude excuse of simply being that way: when traits harm others, their effects need managing and apologies may be necessary. Acceptance differs both from self-adulation and surrender to every impulse.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"personal-projects","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Проект должен быть значимым и посильным","body":"<p>Брайан Литтл предлагает рассматривать личные проекты, а не только абстрактные черты. Важно выбирать значимые цели, соотнося их с возможностями и обстоятельствами. Если цель недостижима, это не обязательно требует отказаться от желания жить хорошо: можно изменить форму проекта, нагрузку, условия или путь к важному результату.<\/p>"},"en":{"section":"7 · How to survive","title":"A personal project needs meaning and feasibility","body":"<p>Brian Little proposes examining personal projects rather than only abstract traits. Meaningful goals need to fit capacities and circumstances. If a goal proves unreachable, that need not mean abandoning the desire for a worthwhile life. The project’s form, demands, conditions or route toward what matters can be changed instead.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"authentic-reconsidered","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Подлинное «я» возвращается без обещания совершенства","body":"<p>К концу книги Сторр пересматривает раннюю интуицию об отсутствии подлинного «я»: устойчивые черты дают основание говорить о нём в ограниченном смысле. Интроверт может выступить общительно, но действие против склонности требует усилия. Это не совершенный внутренний бог Эсалена, а реальные особенности человека, которые нельзя бесконечно переделывать без цены.<\/p>"},"en":{"section":"7 · How to survive","title":"An authentic self returns without a promise of perfection","body":"<p>By the end, Storr revises his earlier intuition that no authentic self exists: stable traits support a limited sense of authenticity. An introvert can behave sociably, but acting against a tendency takes effort. This is not Esalen’s perfect inner god, but real human characteristics that cannot be endlessly remade without cost.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; книга 7; p57 (XHTML paragraph count)"},{"id":"lizard-environment","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Иногда нужно менять условия, а не сущность человека","body":"<p>Сторр сравнивает человека не на своём месте с ящерицей в неподходящем климате: смена среды меняет переживание жизни без обязательной смены природы. Это метафора соответствия, а не клинический рецепт. Она помогает задать практический вопрос: какие отношения, занятия и требования делают мои свойства постоянно болезненными?<\/p>"},"en":{"section":"7 · How to survive","title":"Sometimes the conditions need changing more than the person","body":"<p>Storr compares a person in an unsuitable setting with a lizard in the wrong climate: changing surroundings alters the experience of living without necessarily changing the creature’s nature. This is a metaphor of fit, not a clinical prescription. It invites a practical question about which relationships, activities and demands make one’s characteristics continually painful.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"mismatch-questions","level":3,"claimType":"synthesis","sources":[1],"copy":{"ru":{"section":"7 · Как выжить","title":"Разрыв с идеалом можно разобрать на проверяемые вопросы","body":"<ol class=\"steps\"><li>Какую конкретную трудность я переживаю?<\/li><li>Чей стандарт превращает её в приговор всему человеку?<\/li><li>Что здесь зависит от навыка, условий или ограничений?<\/li><li>Что можно изменить без обещания стать кем угодно?<\/li><\/ol><p>Это рабочий синтез конспекта, а не диагностическая шкала или авторская четырёхшаговая методика.<\/p>"},"en":{"section":"7 · How to survive","title":"A mismatch with an ideal can be broken into examinable questions","body":"<ol class=\"steps\"><li>What specific difficulty am I experiencing?<\/li><li>Whose standard turns it into a verdict on my whole person?<\/li><li>What belongs to skills, conditions or limits?<\/li><li>What can change without promising to become anyone?<\/li><\/ol><p>This is the digest’s working synthesis, not a diagnostic scale or a four-step method prescribed by Storr.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7"},{"id":"method-boundaries","level":2,"claimType":"synthesis","sources":[1,10],"copy":{"ru":{"section":"7 · Как выжить","title":"Убедительный маршрут не равен окончательной научной теории","body":"<p>Сторр признаёт вторичные источники, спорность части социальной психологии, предубеждения и возможность ошибок. Интервью отредактированы; некоторые имена изменены. Рецензия Kirkus отдельно замечает ассоциативность композиции. Историческая цепочка помогает думать, но каждый её переход нужно оценивать по своим данным, а не по силе общего впечатления.<\/p>"},"en":{"section":"7 · How to survive","title":"A compelling journey is not a definitive scientific theory","body":"<p>Storr acknowledges secondary sources, disputes in social psychology, bias and fallibility. Interviews were edited and some names changed. Kirkus separately notes the narrative’s associative organization. The historical chain is useful for thinking, but each connection requires evidence of its own rather than borrowing certainty from the overall story’s persuasive force.<\/p>"}},"bookLocation":"OPS/ch1-23.xhtml; methodology; review source 10"},{"id":"final","level":1,"claimType":"synthesis","sources":[1],"copy":{"ru":{"section":"Финал","title":"Идеал — культурное предложение, а не мера всей жизни","body":"<p class=\"lede\">Я ищу принадлежности и смысла, но не обязан становиться безупречным героем.<\/p><p>Устойчивая модель книги: свойства человека, условия жизни и культурный образец встречаются в рассказе о себе. Полезно проверять образец, менять посильное и подходящую среду, сохранять ответственность — и не превращать неизбежное несовершенство в приговор собственной ценности.<\/p>"},"en":{"section":"Finale","title":"An ideal is a cultural proposal, not the measure of a whole life","body":"<p class=\"lede\">I seek belonging and meaning without having to become a flawless hero.<\/p><p>The book’s durable model brings personal characteristics, living conditions and a cultural ideal together in a self-story. Examine the ideal, change what is feasible and seek fitting conditions, retain responsibility, and avoid turning inevitable imperfection into a verdict on your worth.<\/p>"}},"bookLocation":"OPS/ch1-20.xhtml; ch1-21.xhtml; книга 7","final":true}],"modes":{"essential":{"label":{"ru":"Главное","en":"Essential"},"minutes":{"ru":"9 минут","en":"9 min"}},"core":{"label":{"ru":"Суть книги","en":"Core"},"minutes":{"ru":"20 минут","en":"20 min"}},"deep":{"label":{"ru":"Глубоко","en":"Deep"},"minutes":{"ru":"31 минут","en":"30 min"}}}}</script>

          chapters: 'Главы', sources: 'Источники', light: 'Светлая', dark: 'Тёмная',
          previous: 'Назад', next: 'Дальше', restart: 'Сначала', close: 'Закрыть',
          start: 'Начать просмотр', startOver: 'Начать сначала', continuePrefix: 'Продолжить: «', continueSuffix: '»',
          contentsTitle: 'Оглавление', sourcesTitle: 'Источники и метод', progress: 'Экран', of: 'из',
          depthLabel: 'Глубина чтения', coverTop: 'СИСТЕМА / ИДЕЯ / СЛЕДСТВИЕ', coverBottom: 'ОДНА МОДЕЛЬ, КОТОРУЮ СТОИТ УНЕСТИ',
          railHint: 'Выберите экран или используйте стрелки', sourcePrefix: 'Источники',
          claimTypes: { book: 'Аргумент книги', corroboration: 'Проверка', synthesis: 'Синтез' },
          sourceRoles: { book: 'Книга', publisher: 'Издатель', author: 'Автор', primary: 'Первичный', review: 'Рецензия', reference: 'Справка' },
          switchLanguage: 'Switch to English', switchTheme: 'Переключить тему',
          method: 'Это аналитический конспект, а не копия книги. Фактические утверждения привязаны к источникам; синтез и современные аналогии обозначаются как интерпретация.'
        },
        en: {
          chapters: 'Chapters', sources: 'Sources', light: 'Light', dark: 'Dark',
          previous: 'Back', next: 'Next', restart: 'Restart', close: 'Close',
          start: 'Start reading', startOver: 'Start over', continuePrefix: 'Continue: “', continueSuffix: '”',
          contentsTitle: 'Contents', sourcesTitle: 'Sources and method', progress: 'Screen', of: 'of',
          depthLabel: 'Reading depth', coverTop: 'SYSTEM / IDEA / CONSEQUENCE', coverBottom: 'ONE MODEL TO CARRY FORWARD',
          railHint: 'Choose a screen or use arrow keys', sourcePrefix: 'Sources',
          claimTypes: { book: 'Book argument', corroboration: 'Corroboration', synthesis: 'Synthesis' },
          sourceRoles: { book: 'Book', publisher: 'Publisher', author: 'Author', primary: 'Primary', review: 'Review', reference: 'Reference' },
          switchLanguage: 'Переключить на русский', switchTheme: 'Switch theme',
          method: 'This is an analytical digest, not copied book text. Factual claims are tied to sources; synthesis and present-day analogies are identified as interpretation.'
        }
      };

      const els = {
        appShell: document.getElementById('appShell'), story: document.getElementById('story'),
        progressTrack: document.getElementById('progressTrack'), appNav: document.getElementById('appNav'),
        previousButton: document.getElementById('previousButton'), nextButton: document.getElementById('nextButton'),
        counter: document.getElementById('counter'), contentsButton: document.getElementById('contentsButton'),
        languageButton: document.getElementById('languageButton'), sourcesButton: document.getElementById('sourcesButton'),
        themeButton: document.getElementById('themeButton'), contentsDialog: document.getElementById('contentsDialog'),
        sourcesDialog: document.getElementById('sourcesDialog'), contentsList: document.getElementById('contentsList'),
        desktopContentsList: document.getElementById('desktopContentsList'), dialogModePicker: document.getElementById('dialogModePicker'),
        contentsTitle: document.getElementById('contentsTitle'), sourcesTitle: document.getElementById('sourcesTitle'),
        sourcesList: document.getElementById('sourcesList'), methodNote: document.getElementById('methodNote'),
        railTitle: document.getElementById('railTitle'), railHint: document.getElementById('railHint')
      };

      function stored(key, fallback) {
        try { return localStorage.getItem(storagePrefix + key) || fallback; } catch (_) { return fallback; }
      }

      function save(key, value) {
        try { localStorage.setItem(storagePrefix + key, value); } catch (_) {}
      }

      function removeStored(key) {
        try { localStorage.removeItem(storagePrefix + key); } catch (_) {}
      }

      const state = {
        language: ['ru', 'en'].includes(stored('language', data.defaultLanguage || 'ru')) ? stored('language', data.defaultLanguage || 'ru') : 'ru',
        theme: ['light', 'dark'].includes(stored('theme', data.defaultTheme || 'dark')) ? stored('theme', data.defaultTheme || 'dark') : 'dark',
        mode: modeOrder.includes(stored('mode', data.defaultMode || 'deep')) ? stored('mode', data.defaultMode || 'deep') : 'deep',
        position: 0,
        direction: 'forward'
      };

      function text() { return ui[state.language]; }
      function copyOf(screen) { return screen.copy[state.language]; }
      function visibleScreens() { return data.screens.filter((screen) => screen.level <= levels[state.mode]); }
      function currentScreen() { return visibleScreens()[state.position]; }
      function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }

      function modeCounts() {
        return {
          essential: data.screens.filter((screen) => screen.level <= 1).length,
          core: data.screens.filter((screen) => screen.level <= 2).length,
          deep: data.screens.length
        };
      }

      function modeLabel(mode) {
        const configured = data.modes && data.modes[mode];
        return configured && configured.label ? configured.label[state.language] : mode;
      }

      function modeMinutes(mode) {
        const configured = data.modes && data.modes[mode];
        const minutes = configured && configured.minutes ? configured.minutes[state.language] : null;
        return minutes || `${modeCounts()[mode]}`;
      }

      function renderModeButton(mode) {
        const active = state.mode === mode;
        return `<button class="mode-button${active ? ' is-active' : ''}" type="button" data-mode="${mode}" aria-pressed="${active}"><strong>${escapeHtml(modeLabel(mode))}</strong><span>${escapeHtml(modeMinutes(mode))}</span></button>`;
      }

      function renderModePicker() {
        return modeOrder.map(renderModeButton).join('');
      }

      function mediaFor(screen) {
        if (!screen.media || !data.media || !data.media[screen.media]) return '';
        const media = data.media[screen.media];
        const alt = media.alt ? media.alt[state.language] : '';
        const credit = media.credit ? media.credit[state.language] : '';
        return `<figure class="story-image"><img src="${escapeHtml(media.dataUri)}" alt="${escapeHtml(alt || '')}" decoding="sync">${credit ? `<figcaption>${escapeHtml(credit)}</figcaption>` : ''}</figure>`;
      }

      function coverMediaFor(screen) {
        if (!screen.media || !data.media || !data.media[screen.media]) return '';
        const media = data.media[screen.media];
        const alt = media.alt ? media.alt[state.language] : '';
        const credit = media.credit ? media.credit[state.language] : '';
        return `<figure class="cover-visual has-image"><img src="${escapeHtml(media.dataUri)}" alt="${escapeHtml(alt || '')}" decoding="sync">${credit ? `<figcaption>${escapeHtml(credit)}</figcaption>` : ''}</figure>`;
      }

      function sourceLabel(screen) {
        const claimLabel = text().claimTypes[screen.claimType] || text().claimTypes.book;
        const sourceButton = screen.sources && screen.sources.length
          ? ` · <button type="button" data-open-sources>${escapeHtml(text().sourcePrefix)}: ${screen.sources.join(', ')}</button>`
          : '';
        return `<p class="source-label"><span>${escapeHtml(claimLabel)}</span>${sourceButton}</p>`;
      }

      function renderCover(screen) {
        const copy = copyOf(screen);
        const rememberedId = stored('lastScreen', '');
        const remembered = rememberedId && rememberedId !== screen.id ? data.screens.find((item) => item.id === rememberedId) : null;
        const primaryLabel = remembered ? text().continuePrefix + copyOf(remembered).title + text().continueSuffix : text().start;
        const visual = coverMediaFor(screen) || `<div class="cover-visual" role="img" aria-label="${escapeHtml(copy.visualAlt || copy.title)}"><div class="cover-mark"><span class="cover-eyebrow">${escapeHtml(text().coverTop)}</span><div class="cover-line"><span class="cover-node">01</span><span class="cover-node">02</span><span class="cover-node">03</span><span class="cover-node is-focus">04</span><span class="cover-node">05</span><span class="cover-node">06</span><span class="cover-node">07</span></div><span class="cover-eyebrow">${escapeHtml(text().coverBottom)}</span></div></div>`;
        return `<article class="story-slide${state.direction === 'back' ? ' is-reverse' : ''}"><div class="slide-scroll"><div class="cover-layout">${visual}<div class="cover-copy"><p class="kicker">${escapeHtml(copy.section)}</p><h1>${escapeHtml(copy.title)}</h1>${copy.subtitle ? `<p class="cover-subtitle">${escapeHtml(copy.subtitle)}</p>` : ''}${copy.body || ''}<div class="mode-picker" role="group" aria-label="${escapeHtml(text().depthLabel)}">${renderModePicker()}</div></div><div class="cover-actions"><button class="button button-primary" type="button" data-start="${remembered ? 'continue' : 'begin'}">${escapeHtml(primaryLabel)}</button>${remembered ? `<button class="button" type="button" data-start="begin">${escapeHtml(text().startOver)}</button>` : ''}</div></div></div></article>`;
      }

      function renderScreen(screen) {
        if (screen.type === 'cover') return renderCover(screen);
        const copy = copyOf(screen);
        return `<article class="story-slide${state.direction === 'back' ? ' is-reverse' : ''}" aria-label="${escapeHtml(copy.title)}"><div class="slide-scroll"><p class="kicker">${escapeHtml(copy.section)}</p><h1>${escapeHtml(copy.title)}</h1>${mediaFor(screen)}${copy.body || ''}${sourceLabel(screen)}</div></article>`;
      }

      function renderProgress() {
        const list = visibleScreens();
        els.progressTrack.innerHTML = list.map((_, index) => `<span class="progress-segment${index < state.position ? ' is-complete' : index === state.position ? ' is-current' : ''}" aria-hidden="true"></span>`).join('');
        els.progressTrack.setAttribute('aria-label', `${text().progress} ${state.position + 1} ${text().of} ${list.length}`);
      }

      function renderNavigation() {
        const list = visibleScreens();
        const screen = currentScreen();
        const hidden = screen.type === 'cover';
        els.appNav.classList.toggle('is-hidden', hidden);
        els.previousButton.disabled = state.position === 0;
        els.previousButton.textContent = text().previous;
        els.nextButton.textContent = screen.final || state.position === list.length - 1 ? text().restart : text().next;
        els.counter.textContent = `${state.position + 1} / ${list.length}`;
      }

      function contentsHtml() {
        const list = visibleScreens();
        const activeId = currentScreen().id;
        return list.map((screen, index) => `<button class="contents-item${screen.id === activeId ? ' is-active' : ''}" type="button" data-go-to="${escapeHtml(screen.id)}"${screen.id === activeId ? ' aria-current="page"' : ''}><span class="contents-index">${String(index + 1).padStart(2, '0')}</span><span class="contents-title">${escapeHtml(copyOf(screen).title)}</span></button>`).join('');
      }

      function renderContents() {
        const html = contentsHtml();
        els.contentsList.innerHTML = html;
        els.desktopContentsList.innerHTML = html;
        els.dialogModePicker.innerHTML = renderModePicker();
        requestAnimationFrame(() => {
          const active = els.desktopContentsList.querySelector('.is-active');
          if (active) active.scrollIntoView({ block: 'center' });
        });
      }

      function renderSources() {
        els.sourcesList.innerHTML = data.sources.map((source) => `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a><span class="source-role">${escapeHtml(text().sourceRoles[source.role] || source.role)}</span><p>${escapeHtml(source.note[state.language])}</p></li>`).join('');
      }

      function renderStaticText() {
        const bookTitle = data.title[state.language];
        document.documentElement.lang = state.language;
        document.documentElement.dataset.theme = state.theme;
        document.title = bookTitle;
        document.querySelector('meta[name="description"]').setAttribute('content', data.description[state.language]);
        els.appShell.setAttribute('aria-label', bookTitle);
        els.contentsButton.textContent = text().chapters;
        els.sourcesButton.textContent = text().sources;
        els.languageButton.textContent = state.language === 'ru' ? 'EN' : 'RU';
        els.languageButton.setAttribute('aria-label', text().switchLanguage);
        els.themeButton.textContent = state.theme === 'dark' ? text().light : text().dark;
        els.themeButton.setAttribute('aria-label', text().switchTheme);
        els.contentsTitle.textContent = text().contentsTitle;
        els.sourcesTitle.textContent = text().sourcesTitle;
        els.dialogModePicker.setAttribute('role', 'group');
        els.dialogModePicker.setAttribute('aria-label', text().depthLabel);
        els.methodNote.textContent = data.methodNote ? data.methodNote[state.language] : text().method;
        els.railTitle.textContent = bookTitle;
        els.railHint.textContent = text().railHint;
        document.querySelectorAll('[data-close-dialog]').forEach((button) => { button.textContent = text().close; });
      }

      function bindRenderedControls() {
        document.querySelectorAll('[data-mode]').forEach((button) => {
          button.addEventListener('click', () => setMode(button.dataset.mode));
        });
        document.querySelectorAll('[data-go-to]').forEach((button) => {
          button.addEventListener('click', () => {
            goToId(button.dataset.goTo);
            if (els.contentsDialog.open) els.contentsDialog.close();
          });
        });
        document.querySelectorAll('[data-start]').forEach((button) => {
          button.addEventListener('click', () => start(button.dataset.start === 'continue'));
        });
        document.querySelectorAll('[data-open-sources]').forEach((button) => {
          button.addEventListener('click', () => els.sourcesDialog.showModal());
        });
      }

      function render() {
        const list = visibleScreens();
        if (state.position >= list.length) state.position = Math.max(0, list.length - 1);
        renderStaticText();
        els.story.innerHTML = renderScreen(currentScreen());
        renderProgress();
        renderNavigation();
        renderContents();
        renderSources();
        bindRenderedControls();
        if (currentScreen().type !== 'cover') save('lastScreen', currentScreen().id);
      }

      function goToPosition(position, direction) {
        const list = visibleScreens();
        state.position = Math.max(0, Math.min(position, list.length - 1));
        state.direction = direction || 'forward';
        render();
      }

      function requiredMode(level) {
        return level <= 1 ? 'essential' : level === 2 ? 'core' : 'deep';
      }

      function goToId(id) {
        let list = visibleScreens();
        let index = list.findIndex((screen) => screen.id === id);
        if (index < 0) {
          const hidden = data.screens.find((screen) => screen.id === id);
          if (hidden) {
            state.mode = requiredMode(hidden.level);
            save('mode', state.mode);
            list = visibleScreens();
            index = list.findIndex((screen) => screen.id === id);
          }
        }
        if (index >= 0) goToPosition(index, index < state.position ? 'back' : 'forward');
      }

      function setMode(mode) {
        if (!modeOrder.includes(mode)) return;
        const currentId = currentScreen().id;
        state.mode = mode;
        save('mode', mode);
        const list = visibleScreens();
        const nextIndex = list.findIndex((screen) => screen.id === currentId);
        state.position = nextIndex >= 0 ? nextIndex : 0;
        render();
      }

      function start(continueSaved) {
        const rememberedId = continueSaved ? stored('lastScreen', '') : '';
        if (rememberedId) goToId(rememberedId);
        else goToPosition(Math.min(1, visibleScreens().length - 1), 'forward');
      }

      function next() {
        const list = visibleScreens();
        const screen = currentScreen();
        if (screen.final || state.position === list.length - 1) {
          removeStored('lastScreen');
          goToPosition(0, 'forward');
          return;
        }
        goToPosition(state.position + 1, 'forward');
      }

      function previous() {
        if (state.position > 0) goToPosition(state.position - 1, 'back');
      }

      els.previousButton.addEventListener('click', previous);
      els.nextButton.addEventListener('click', next);
      els.contentsButton.addEventListener('click', () => els.contentsDialog.showModal());
      els.sourcesButton.addEventListener('click', () => els.sourcesDialog.showModal());
      els.languageButton.addEventListener('click', () => {
        state.language = state.language === 'ru' ? 'en' : 'ru';
        save('language', state.language);
        render();
      });
      els.themeButton.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        save('theme', state.theme);
        render();
      });

      document.querySelectorAll('[data-close-dialog]').forEach((button) => {
        button.addEventListener('click', () => document.getElementById(button.dataset.closeDialog).close());
      });

      document.addEventListener('keydown', (event) => {
        if (els.contentsDialog.open || els.sourcesDialog.open) return;
        if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
          event.preventDefault();
          next();
        } else if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
          event.preventDefault();
          previous();
        }
      });

      let pointerStart = null;
      els.story.addEventListener('pointerdown', (event) => {
        pointerStart = { x: event.clientX, y: event.clientY, id: event.pointerId };
      });
      els.story.addEventListener('pointerup', (event) => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(dx) < 48 || Math.abs(dx) <= Math.abs(dy) * 1.25) return;
        dx < 0 ? next() : previous();
      });
      els.story.addEventListener('pointercancel', () => { pointerStart = null; });

      const rememberedId = stored('lastScreen', '');
      if (rememberedId) {
        const index = visibleScreens().findIndex((screen) => screen.id === rememberedId);
        if (index >= 0) state.position = 0;
      }
      render();
    })();
  </script>
  <script>
    (function () {
      'use strict';
      const root = document.documentElement;
      const story = document.getElementById('story');
      if (!story) return;
      const key = `bookFocusMode:${location.pathname}`;
      let tap = null;

      function storedFocus() {
        try { return sessionStorage.getItem(key) === 'true'; } catch (_) { return false; }
      }

      function setFocus(enabled) {
        if (enabled) root.setAttribute('data-focus-mode', 'true');
        else root.removeAttribute('data-focus-mode');
        try { sessionStorage.setItem(key, enabled ? 'true' : 'false'); } catch (_) {}
      }

      function isInteractive(target) {
        return Boolean(target && target.closest('a, button, input, textarea, select, summary, details, dialog, [role="button"], [contenteditable="true"]'));
      }

      function hasSelection() {
        const selection = window.getSelection && window.getSelection();
        return Boolean(selection && !selection.isCollapsed && String(selection).trim());
      }

      setFocus(storedFocus());
      story.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        if (isInteractive(event.target)) return;
        tap = { id: event.pointerId, x: event.clientX, y: event.clientY, time: Date.now() };
      }, true);
      story.addEventListener('pointerup', (event) => {
        if (!tap || tap.id !== event.pointerId) { tap = null; return; }
        const dx = event.clientX - tap.x;
        const dy = event.clientY - tap.y;
        const elapsed = Date.now() - tap.time;
        tap = null;
        if (Math.hypot(dx, dy) > 12 || elapsed > 550 || hasSelection() || isInteractive(event.target)) return;
        setFocus(root.getAttribute('data-focus-mode') !== 'true');
      }, true);
      story.addEventListener('pointercancel', () => { tap = null; }, true);
      document.addEventListener('keydown', (event) => {
        if (isInteractive(event.target) || document.querySelector('dialog[open]')) return;
        if ((event.key === 'f' || event.key === 'F' || event.key === 'а' || event.key === 'А') && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          setFocus(root.getAttribute('data-focus-mode') !== 'true');
        } else if (event.key === 'Escape' && root.getAttribute('data-focus-mode') === 'true') {
          setFocus(false);
        }
      });
    }());
  </script>
</body>
