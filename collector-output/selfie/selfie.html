    :root {
      color-scheme: light;
      --color-bg: #fffcf0;
      --color-surface: #f2f0e5;
      --color-surface-raised: #ffffff;
      --color-fill: #e6e4d9;
      --color-text: #100f0f;
      --color-text-muted: #6f6e69;
      --color-text-faint: #9f9d96;
      --color-border: #dad8ce;
      --color-border-strong: #b7b5ac;
      --color-primary: #5b2fc2;
      --color-primary-hover: #7045d5;
      --color-primary-active: #4b24ab;
      --color-on-primary: #fffcf0;
      --color-focus-ring: rgba(91, 47, 194, 0.26);
      --color-backdrop: rgba(16, 15, 15, 0.64);
      --shadow-shell: 0 18px 54px rgba(16, 15, 15, 0.12);

      --font-reading: "Geist", system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
      --text-2xs: 0.6875rem;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.375rem;
      --text-2xl: 1.75rem;
      --text-3xl: 2.25rem;
      --text-4xl: 3rem;
      --text-6xl: 5.5rem;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;

      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --radius-full: 999px;
      --control-height: 44px;
      --header-height: 72px;
      --footer-height: 72px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #100f0f;
      --color-surface: #1c1b1a;
      --color-surface-raised: #242321;
      --color-fill: #2d2c29;
      --color-text: #cecdc3;
      --color-text-muted: #9f9d96;
      --color-text-faint: #6f6e69;
      --color-border: #343331;
      --color-border-strong: #575653;
      --color-primary-hover: #7045d5;
      --color-primary-active: #4b24ab;
      --color-on-primary: #fffcf0;
      --color-focus-ring: rgba(112, 69, 213, 0.38);
      --color-backdrop: rgba(0, 0, 0, 0.72);
      --shadow-shell: 0 18px 54px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-reading);
      font-size: 16px;
      line-height: 1.48;
    }

    body {
      min-height: 100dvh;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--color-focus-ring);
    }

    button[disabled] {
      opacity: 0.42;
      pointer-events: none;
    }

    .app-stage {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-4);
    }

    .app-shell {
      width: min(100%, 440px);
      height: min(880px, calc(100dvh - 2rem));
      min-height: 620px;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      background: var(--color-bg);
      box-shadow: var(--shadow-shell);
    }

    .app-header {
      min-width: 0;
      padding: max(var(--space-3), env(safe-area-inset-top)) var(--space-4) var(--space-3);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
    }

    .progress-track {
      height: 3px;
      display: flex;
      gap: 2px;
      margin-bottom: var(--space-3);
      overflow: hidden;
      border-radius: var(--radius-full);
    }

    .progress-segment {
      min-width: 1px;
      flex: 1 1 auto;
      border-radius: var(--radius-full);
      background: var(--color-fill);
    }

    .progress-segment.is-complete,
    .progress-segment.is-current {
      background: var(--color-text);
    }

    .progress-segment.is-current {
      min-width: 5px;
    }

    .topbar {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .topbar-group {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .button {
      min-height: var(--control-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 650;
      cursor: pointer;
    }

    .button:hover {
      background: var(--color-fill);
    }

    .button-primary {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: var(--color-on-primary);
    }

    .button-primary:hover {
      border-color: var(--color-primary-hover);
      background: var(--color-primary-hover);
    }

    .button-primary:active {
      border-color: var(--color-primary-active);
      background: var(--color-primary-active);
    }

    .button-quiet {
      min-height: 36px;
      padding-inline: var(--space-2);
      border-color: transparent;
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .button-quiet:hover {
      border-color: transparent;
      background: var(--color-fill);
      color: var(--color-text);
    }

    .story {
      min-width: 0;
      min-height: 0;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .story-slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      animation: slide-in 180ms ease both;
    }

    .story-slide.is-reverse {
      animation-name: slide-in-reverse;
    }

    .slide-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-strong) transparent;
      padding: var(--space-3) var(--space-6) var(--space-8);
    }

    .slide-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .slide-scroll::-webkit-scrollbar-thumb {
      border-radius: var(--radius-full);
      background: var(--color-border-strong);
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slide-in-reverse {
      from { opacity: 0; transform: translateX(-18px); }
      to { opacity: 1; transform: translateX(0); }
    }

    h1,
    h2,
    p,
    figure,
    ul,
    ol,
    blockquote {
      margin-top: 0;
    }

    h1 {
      max-width: 24ch;
      margin-bottom: var(--space-5);
      font-size: clamp(var(--text-2xl), 8vw, var(--text-3xl));
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    h2 {
      margin-bottom: var(--space-2);
      font-size: var(--text-lg);
      line-height: 1.16;
      letter-spacing: -0.02em;
    }

    p,
    li {
      font-size: var(--text-base);
    }

    .kicker,
    .fact-label,
    .contents-index,
    .source-label,
    .cover-eyebrow {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .kicker {
      margin-bottom: var(--space-3);
      color: var(--color-text-muted);
      font-weight: 650;
    }

    .lede {
      font-size: var(--text-xl);
      line-height: 1.28;
      letter-spacing: -0.025em;
    }

    .muted {
      color: var(--color-text-muted);
    }

    .hero-number {
      margin-block: var(--space-6);
      font-family: var(--font-mono);
      font-size: clamp(var(--text-4xl), 22vw, var(--text-6xl));
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .fact,
    .compare-item,
    .metric-card,
    blockquote {
      margin-block: var(--space-4);
      padding: var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
    }

    .fact-label {
      display: block;
      margin-bottom: var(--space-2);
      color: var(--color-text-muted);
    }

    .fact p,
    .compare-item p,
    .metric-card p,
    blockquote p {
      margin-bottom: 0;
    }

    .compare,
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
      margin-block: var(--space-4);
    }

    .metric-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .compare-item,
    .metric-card {
      min-width: 0;
      margin-block: 0;
    }

    .metric-card strong {
      display: block;
      margin-bottom: var(--space-2);
      font-family: var(--font-mono);
      font-size: var(--text-2xl);
    }

    .story-list,
    .steps {
      margin-block: var(--space-4);
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--color-border);
    }

    .story-list li,
    .steps li {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(3.5rem, auto) minmax(0, 1fr);
      gap: var(--space-3);
      padding-block: var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }

    .story-list .index,
    .steps .index {
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 650;
    }

    .story-list strong,
    .story-list span:not(.index),
    .steps strong,
    .steps span:not(.index) {
      display: block;
    }

    .story-list span:not(.index),
    .steps span:not(.index) {
      margin-top: var(--space-1);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }

    .story-image {
      margin-bottom: var(--space-5);
    }

    .story-image img {
      width: 100%;
      max-height: 44dvh;
      display: block;
      object-fit: cover;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
    }

    .story-image figcaption {
      margin-top: var(--space-2);
      color: var(--color-text-muted);
      font-size: var(--text-xs);
    }

    .source-label {
      margin-top: var(--space-8);
      padding-top: var(--space-3);
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
      letter-spacing: 0;
      text-transform: none;
    }

    .source-label > span {
      font-weight: 700;
    }

    .source-label button {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    .cover-layout {
      min-height: 100%;
      display: flex;

    .cover-line {

      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: var(--space-2);
      align-items: center;
    }

    .cover-node {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-full);

      padding: var(--space-1);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
    }

    .mode-button {
      min-width: 0;
      padding: var(--space-2);

      color: var(--color-text-muted);

      gap: var(--space-3);
      padding: var(--space-3) var(--space-4) max(var(--space-3), env(safe-area-inset-bottom));
      border-top: 1px solid var(--color-border);
      background: var(--color-bg);
    }

    .app-nav.is-hidden {

    }

    .app-nav .button:first-child {
      justify-self: start;
    }

    .app-nav .button:last-child {
      justify-self: end;
    }

    .counter {
      min-width: 4.5rem;
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      text-align: center;
    }

    .desktop-rail {
      display: none;
    }

    dialog {

      overflow: hidden;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-lg);
      background: var(--color-bg);
      color: var(--color-text);
      box-shadow: var(--shadow-shell);
    }

    dialog::backdrop {
      background: var(--color-backdrop);
    }

    .dialog-shell {
      max-height: min(84dvh, 760px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .dialog-header,
    .dialog-footer {

      align-items: center;
      justify-content: space-between;

      padding: var(--space-4);

      padding: var(--space-3);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text);
      text-align: left;
      cursor: pointer;

    .contents-item.is-active {

      background: var(--color-surface);
    }

    .contents-index {
      color: var(--color-text-muted);
      letter-spacing: 0;
    }

    .contents-title {
      min-width: 0;
      font-size: var(--text-sm);
      font-weight: 650;
    }

    .sources-list {

      padding-left: 1.5rem;

    .sources-list a {

    }

      margin-left: var(--space-2);
      color: var(--color-text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      text-transform: uppercase;
    }

    .sources-list p {
      margin: var(--space-1) 0 0;
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }

    .method-note {
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-size: var(--text-sm);

    @media (max-width: 520px) {

        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

    @media (max-width: 359px) {

      .app-nav {

        font-size: var(--text-2xs);
      }

      .slide-scroll {

      }

        background: var(--color-surface);

      }

        color: var(--color-text-muted);

      }

        align-items: center;
        column-gap: var(--space-10);
      }

      .cover-visual {

        grid-row: 1 / 3;
      }

      .cover-actions {
        align-self: end;
      }

        font-size: var(--text-3xl);

      }
    }
  </style>
</head>

га · Источник 1 · Аналитический пересказ<\/p>","subtitle":"Почему мы зациклены на себе и как это на нас влияет","visualAlt":"Обложка предоставленного русского издания «Селфи»"},"en":{"section":"Start","title":"Selfie","body":"<p>Will Storr asks why the promise of becoming anyone turns into an obligation to be flawless. This is a history of a cultural ideal, the social brain and the cost of falling short — from ancient Greece to digital platforms.<\/p><p class=\"source-label\">Book · Source 1 · Analytical digest<\/p>","subtitle":"How We Became So Self-Obsessed and What It’s Doing to Us","visualAlt":"Cover of the supplied Russian edition of Selfie"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0","type":"cover","media":"epub-cover"},{"id":"whose-ideal","level":1,"claimType":"book","sources":[1,2],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Чьей идеальной жизнью мы пытаемся жить?","body":"<p>Стройность, успех, общительность и счастье выглядят личными желаниями. Сторр предлагает заметить их общий культурный шаблон: мы не только хотим чего-то, но и считаем себя обязанными этого хотеть. Вопрос книги — кто придумал человека, которым нам стыдно не быть.<\/p>"},"en":{"section":"0 · The dying self","title":"Whose perfect life are we trying to live?","body":"<p>Being fit, successful, sociable and happy looks like a collection of personal desires. Storr asks us to notice their shared cultural template: we do not simply want things; we feel obliged to want them. His question is who invented the person we feel ashamed of failing to become.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"debbie-case","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Дебби открывает исследование ценой идеала","body":"<p>Книга начинается с Дебби Хэмптон, пережившей попытку самоубийства и тяжёлое восстановление. Её история вводит разрыв между обещанной благополучной жизнью и переживанием собственного провала. Это человеческий случай, с которого начинается вопрос, а не доказательство одной причины всех подобных трагедий.<\/p>"},"en":{"section":"0 · The dying self","title":"Debbie makes the cost of the ideal visible","body":"<p>The book opens with Debbie Hampton, who survived a suicide attempt and faced a difficult recovery. Her story introduces the gap between a promised successful life and the experience of personal failure. It gives the inquiry human stakes; it does not establish one cause for every such tragedy.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"whole-self-verdict","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Неудача в деле становится приговором человеку","body":"<p>Перфекционистская ловушка возникает, когда отдельный неуспех обобщается до полной неполноценности: ошибся не поступок, плох весь человек. Поэтому дело не сводится к высокой планке. Опасно условие, при котором право уважать себя зависит от непрерывного соответствия недостижимому образцу.<\/p>"},"en":{"section":"0 · The dying self","title":"Failure at a task becomes a verdict on a person","body":"<p>The perfectionistic trap turns a particular setback into total inadequacy: the action was not merely mistaken; the entire person is defective. This goes beyond setting high standards. The danger is making self-respect conditional on continuously matching an unattainable model, so that an ordinary mistake threatens the whole identity.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"socially-prescribed","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Мы страдаем и от воображаемых требований","body":"<p>Рори О’Коннор объясняет социально предписанный перфекционизм: человеку кажется, что окружающие ждут от него исключительно идеальных результатов. Требование может быть реальным или ошибочно прочитанным. Важен переживаемый долг не подвести других в роли родителя, партнёра, работника или друга.<\/p>"},"en":{"section":"0 · The dying self","title":"Imagined expectations can carry real weight","body":"<p>Rory O’Connor describes socially prescribed perfectionism: a person believes that other people expect flawless results. The demand may be real or misread. What matters is the felt obligation not to disappoint others as a parent, partner, employee or friend, making an imperfect performance feel like a broken social bond.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"perfectionism-varieties","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Разные виды перфекционизма болят по-разному","body":"<p>Гордон Флетт различает требования к себе, необходимость выглядеть идеальным перед другими и уязвимость уверенного в своей исключительности человека. Эти описания не равны одному диагнозу. Сторра интересует общий механизм: ценность личности оказывается привязана к стандарту, который трудно выдерживать постоянно.<\/p>"},"en":{"section":"0 · The dying self","title":"Different perfectionisms create different vulnerabilities","body":"<p>Gordon Flett discusses demands directed at oneself, pressure to appear perfect to others, and the vulnerability of someone convinced of their exceptional potential. These descriptions are not one diagnosis. Storr follows a shared mechanism: personal worth becomes tied to a standard that cannot reliably be maintained.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"hidden-imperfection","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Показ совершенства требует скрывать трудности","body":"<p>Перфекционистская самопрезентация — не просто желание хорошо выглядеть. Это необходимость не показывать промахов и не признавать слабость. Окружающие видят отредактированный результат, сравнивают с ним свою полную жизнь и получают ложный сигнал, будто трудности есть только у них.<\/p>"},"en":{"section":"0 · The dying self","title":"Displaying perfection requires concealing difficulty","body":"<p>Perfectionistic self-presentation involves more than wanting to look good. It requires hiding mistakes and avoiding admissions of weakness. Others see an edited result and compare it with their own unedited lives. The comparison can misleadingly suggest that everyone else copes effortlessly and that their own difficulties reveal a uniquely defective self.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"multiple-causes","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Перфекционизм — фактор риска, не универсальный ответ","body":"<p>Сторр прямо признаёт: к самоубийству и самоповреждению ведёт множество путей, а тяжёлые ожидания были и у прежних поколений. Его расследование выделяет возможный опасный культурный вклад. Оно не даёт права объяснять отдельную смерть одной чертой характера, платформой или общественной идеологией.<\/p>"},"en":{"section":"0 · The dying self","title":"Perfectionism is a risk factor, not a universal explanation","body":"<p>Storr explicitly acknowledges many routes to suicide and self-harm, and the existence of harsh expectations in earlier generations. His inquiry isolates a potentially dangerous cultural contribution. It does not license explaining an individual death through one personality trait, one platform or one social ideology, while ignoring other conditions and circumstances.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"gendered-roles","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Идеал задаёт противоречивые социальные роли","body":"<p>Мужчинам может предписываться неуязвимость и победа, женщинам — безупречное сочетание внешности, карьеры и заботы. Сторр описывает также пересечение этих требований между полами. Механизм не в том, что одна группа страдает одинаково: культурная роль превращает ограниченные человеческие возможности в моральный экзамен.<\/p>"},"en":{"section":"0 · The dying self","title":"The ideal assigns conflicting social roles","body":"<p>Men may be expected to be invulnerable winners; women may face an impeccable combination of appearance, career and care. Storr also describes these demands crossing gender boundaries. The point is not that everyone in a group suffers identically. A social role turns limited human capacities into a moral examination.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"two-investigations","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Книга исследует аппарат «я» и его культурное задание","body":"<p>Одного объяснения устройством мозга недостаточно: оно не говорит, почему именно такие достижения считаются достойными. Одной истории культуры тоже мало: она не объясняет силу стыда и одобрения. Поэтому Сторр ведёт два расследования — как действует социальное «я» и чему общество учит его стремиться.<\/p><div class=\"compare\"><div class=\"compare-item\"><strong>Аппарат «я»<\/strong><p>Потребности, репутация, самообъяснение.<\/p><\/div><div class=\"compare-item\"><strong>Культурное задание<\/strong><p>Какой человек должен заслуживать признания.<\/p><\/div><\/div>"},"en":{"section":"0 · The dying self","title":"The inquiry separates the self’s machinery from its cultural assignment","body":"<p>Brain mechanisms alone cannot explain why these particular achievements count as worthy. Cultural history alone cannot explain the force of shame and approval. Storr therefore runs two inquiries together: how the social self works, and what society teaches that self to pursue. Their interaction is the organizing problem of the book.<\/p><div class=\"compare\"><div class=\"compare-item\"><strong>The machinery<\/strong><p>Needs, reputation and self-explanation.<\/p><\/div><div class=\"compare-item\"><strong>The cultural assignment<\/strong><p>Which person is supposed to deserve recognition.<\/p><\/div><\/div>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"trend-after-book","level":3,"claimType":"corroboration","sources":[9],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"Позднейшие данные поддерживают ограниченный тренд","body":"<div class=\"fact\"><span class=\"fact-label\">Студенты · 1989–2016<\/span><p class=\"hero-number\">41 641<\/p><\/div><p>Метаанализ Каррана и Хилла, опубликованный после оригинала книги, объединил 164 выборки и 41 641 студента США, Канады и Великобритании за 1989–2016 годы. Он обнаружил рост нескольких измерений перфекционизма. Это поддержка тренда в конкретной популяции, но не доказательство одной культурной причины.<\/p>"},"en":{"section":"0 · The dying self","title":"Later evidence supports a bounded trend","body":"<div class=\"fact\"><span class=\"fact-label\">College students · 1989–2016<\/span><p class=\"hero-number\">41 641<\/p><\/div><p>Published after the original book, Curran and Hill’s meta-analysis combined 164 samples and 41,641 college students in the US, Canada and UK from 1989–2016. Several dimensions of perfectionism increased. This supports a trend in a bounded population; it does not establish one cultural cause or describe all young people.<\/p>"}}},{"id":"thesis-contract","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"0 · Умирающее «я»","title":"«Я» ищет одобрения, культура задаёт образец","body":"<p>Основная гипотеза Сторра: наши древние потребности в принадлежности и статусе встречаются с исторически изменчивым образом достойного человека. Мы усваиваем этот образ настолько глубоко, что принимаем его за собственную природу. Чтобы понять нынешнюю одержимость собой, нужно восстановить историю требований, обращённых к этому «я».<\/p>"},"en":{"section":"0 · The dying self","title":"The self seeks approval; culture supplies the model","body":"<p>Storr’s central hypothesis brings ancient needs for belonging and status together with a historically changing image of the worthy person. We absorb that image deeply enough to mistake it for our own nature. Understanding current self-obsession therefore requires recovering the history of the demands addressed to this self.<\/p>"}},"bookLocation":"OPS/ch1-3.xhtml; книга 0"},{"id":"belong-and-surpass","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Мы хотим быть своими — и превзойти своих","body":"<p>Социальное «я» решает две задачи, которые не всегда совместимы: оставаться принятым группой и занять в ней выгодное место. Сторр видит здесь источник нашей двойственности. Мы нуждаемся в сотрудничестве и одобрении, но одновременно следим, кто сильнее, заметнее и ценнее для окружающих.<\/p>"},"en":{"section":"1 · The tribal self","title":"We want to belong and to outrank our peers","body":"<p>The social self faces two tasks that do not always align: remaining accepted by the group and gaining a favourable place within it. Storr locates a basic human tension here. We need cooperation and approval while also tracking who is stronger, more visible and more valuable to the people around us.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"pridmore-tribes","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Джон Придмор меняет племя, а не прошлое","body":"<p>Бывший лондонский преступник становится католическим проповедником. Его история позволяет Сторру сопоставить две системы признания: устрашать и быть верным банде либо помогать и свидетельствовать о вере. Это резкая смена жизненного сюжета, но прежние импульсы и особенности характера не исчезают по приказу.<\/p>"},"en":{"section":"1 · The tribal self","title":"John Pridmore changes tribes without erasing his past","body":"<p>A former London criminal becomes a Catholic preacher. His story lets Storr compare two systems of recognition: intimidation and loyalty to a gang, or helping others and bearing witness to faith. The life narrative changes dramatically, but earlier impulses and features of temperament do not simply vanish on command.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"gang-reputation","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Репутация может сделать жестокость обязанностью","body":"<p>В мире Придмора публичное унижение угрожало положению среди своих. Насилие могло переживаться как защита заслуженного имени и служение группе. Сторр не оправдывает это: он показывает, почему субъективное чувство правоты не гарантирует нравственности, если правила признания задаёт жестокое окружение.<\/p>"},"en":{"section":"1 · The tribal self","title":"Reputation can turn cruelty into a duty","body":"<p>In Pridmore’s world, public humiliation threatened standing among his peers. Violence could feel like defending an earned name and serving the group. Storr does not excuse it. He shows why a subjective sense of righteousness cannot guarantee moral conduct when a violent social environment supplies the rules for recognition.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"ape-politics","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Сила действует вместе с коалициями и заботой","body":"<p>Сравнение с шимпанзе вводит политику иерархии: положение удерживается не только угрозой, но и союзами, защитой и примирением. У Сторра это эволюционная рамка, помогающая увидеть знакомые мотивы. Она не означает, что современные люди обязаны повторять поведение приматов или что культура ничего не меняет.<\/p>"},"en":{"section":"1 · The tribal self","title":"Power operates through coalitions as well as force","body":"<p>The comparison with chimpanzees introduces the politics of hierarchy: position depends on alliances, protection and reconciliation as well as threats. For Storr this evolutionary frame makes familiar motives visible. It does not mean modern humans must repeat primate behaviour, or that cultural institutions cannot alter how those motives are expressed.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"gossip-teaches","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Сплетня учит, каким человеком следует быть","body":"<p>Истории о достойных и недостойных людях передают правила репутации. Они сообщают, кого группа вознаграждает, кому доверяет и кого наказывает. Поэтому культурный идеал усваивается не только на уроках морали: он скрыт в повседневных оценках чужой жизни и в ожидании таких же оценок о себе.<\/p>"},"en":{"section":"1 · The tribal self","title":"Gossip teaches us which kind of person to become","body":"<p>Stories about admirable and disreputable people transmit the rules of reputation. They tell us whom the group rewards, trusts or punishes. Cultural ideals are therefore learned beyond explicit moral instruction: they are embedded in everyday judgments about other people’s lives, and in the expectation that our own lives will be judged similarly.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"ingroup-morality","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Добро для своих не всегда добро для остальных","body":"<p>Сторр связывает кооперацию с границами группы. Преданность товарищам может сочетаться с презрением к посторонним; самоотверженный член банды причиняет вред другим. Этот парадокс важен для всей книги: стремиться быть хорошим в глазах своего племени — не то же самое, что независимо оценивать последствия поступков.<\/p>"},"en":{"section":"1 · The tribal self","title":"Goodness toward insiders can coexist with harm to outsiders","body":"<p>Storr connects cooperation with group boundaries. Loyalty to companions can coexist with contempt for outsiders; a devoted gang member may harm other people. The paradox matters throughout the book: trying to be good in one’s own tribe’s eyes differs from independently evaluating the consequences of one’s actions for everyone affected.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"minimal-groups","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Даже условная граница запускает предпочтение своих","body":"<p>Сторр обращается к экспериментам минимальных групп: для появления пристрастного отношения не всегда нужна долгая история вражды. Сам факт разделения может влиять на распределение симпатий и ресурсов. Это лабораторная иллюстрация склонности, а не полная теория любого политического конфликта или неизбежности ненависти.<\/p>"},"en":{"section":"1 · The tribal self","title":"Even an arbitrary boundary can favour insiders","body":"<p>Storr invokes minimal-group experiments: a long history of hostility is not always necessary for partiality to emerge. A simple division can affect sympathy and resource allocation. This is a laboratory illustration of a tendency, not a complete theory of political conflict or a demonstration that hatred between groups is inevitable.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"infant-caveat","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Ранние моральные предпочтения не решают вопрос об их происхождении","body":"<p>В книге описаны исследования маленьких детей, предпочитающих помощников помехам. Сторр использует их, чтобы обсуждать ранние основы морали. Но наблюдение раннего предпочтения само по себе не отделяет врождённое от быстро усвоенного и не доказывает единственную теорию эволюции альтруизма; примечания признают часть разногласий.<\/p>"},"en":{"section":"1 · The tribal self","title":"Early moral preferences do not settle their origin","body":"<p>The book describes young children preferring helpers to hinderers and uses these studies to discuss early foundations of morality. An early preference alone cannot separate what is innate from what is rapidly learned, however, or establish a single evolutionary account of altruism. Storr’s notes acknowledge some disagreements about that larger explanation.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"self-as-story","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Внутренний рассказ создаёт чувство цельного автора","body":"<p>Мы переживаем поступки как решения одного устойчивого человека. Сторр предлагает другую перспективу: мозг связывает ощущения, действия и воспоминания в понятный рассказ. Такой рассказ помогает ориентироваться, но убедительность объяснения не доказывает, что оно точно передаёт процессы, из которых действительно возникло действие.<\/p>"},"en":{"section":"1 · The tribal self","title":"An inner story creates the feeling of a unified author","body":"<p>We experience actions as decisions made by one enduring person. Storr offers another perspective: the brain connects sensations, actions and memories into an intelligible story. That story helps us navigate life. Its persuasiveness does not establish that it accurately reports the processes that actually produced the action in the first place.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"split-brain","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Разделённый мозг показывает объяснение без доступа к причине","body":"<p>В описанных опытах информация поступает одному полушарию, а речевые системы другого не получают к ней обычного доступа. Пациент всё же предлагает правдоподобную причину поведения. Для Сторра это сильная иллюстрация того, как объяснение может появляться после действия и ощущаться знанием, хотя часть информации недоступна.<\/p>"},"en":{"section":"1 · The tribal self","title":"Split-brain cases reveal explanations without access to causes","body":"<p>In the experiments described, information reaches one hemisphere while the other hemisphere’s language systems lack their usual access to it. The patient nevertheless offers a plausible reason for an action. Storr uses this to illustrate how an explanation can follow behaviour and feel like knowledge despite missing relevant information.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"interpreter-evidence","level":2,"claimType":"corroboration","sources":[4],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Интерпретатор — исследовательская модель, не маленький человек в голове","body":"<p>Газзанига описывает множество специализированных систем мозга и механизм, связывающий их работу в объяснение. Его обзор поддерживает эту исследовательскую линию. Но перенос от пациентов с разделёнными полушариями к любому повседневному суждению требует осторожности: эксперимент не делает каждое наше объяснение ложным.<\/p>"},"en":{"section":"1 · The tribal self","title":"The interpreter is a research model, not a person inside the head","body":"<p>Gazzaniga describes many specialized brain systems and an interpreter that connects their activity into explanations. His review supports this research account. Extending findings from split-brain patients to every everyday judgment requires caution, however: the experiment does not make all our explanations false or identify a miniature person directing the brain.<\/p>"}}},{"id":"choice-blindness","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Можно защищать выбор, которого не делал","body":"<p>Сторр приводит опыт с незаметной подменой выбранной фотографии. Часть участников объясняла привлекательность уже другого лица, не замечая замены. Важен не тезис о всеобщем обмане, а уязвимость интроспекции: готовность дать уверенное объяснение иногда превышает доступ к действительным основаниям собственного предпочтения.<\/p>"},"en":{"section":"1 · The tribal self","title":"People can defend a choice they did not make","body":"<p>Storr describes an experiment that secretly switched a selected photograph. Some participants explained the attractiveness of a different face without noticing the substitution. The lesson is not universal deception but a limit of introspection: readiness to give a confident explanation can exceed access to the actual basis of one’s preference.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"free-will-boundary","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Ограниченный доступ к причинам не закрывает спор о свободе воли","body":"<p>Сторр склоняется к сильному влиянию бессознательных причин и передаёт скепсис ряда нейробиологов. При этом он упоминает несогласие о степени контроля. Из ошибок самообъяснения не следует единственный философский вывод: способность замечать мотивы, учиться и отвечать за последствия остаётся отдельным вопросом.<\/p>"},"en":{"section":"1 · The tribal self","title":"Limited access to causes does not settle free will","body":"<p>Storr emphasizes unconscious causes and reports the scepticism of several neuroscientists, while noting disagreement about the degree of control. Errors in self-explanation do not entail one philosophical conclusion. Our capacity to recognize motives, learn and take responsibility for consequences remains a distinct question from whether introspection is always reliable.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"culture-writes-plots","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"1 · Племенное «я»","title":"Культура даёт внутреннему рассказчику готовые сюжеты","body":"<p>Придмор понимает переломный опыт через католические образы спасения и зла. Сторр предлагает психологическое толкование, отличное от самого Придмора; это важно различать. Общий ход аргумента — личный рассказ собирается из доступного культурного материала, поэтому даже глубоко внутренний опыт не существует вне общественных историй.<\/p>"},"en":{"section":"1 · The tribal self","title":"Culture supplies ready-made plots to the inner narrator","body":"<p>Pridmore understands a turning point through Catholic images of salvation and evil. Storr offers a psychological interpretation that differs from Pridmore’s own; the distinction matters. The general argument is that personal narratives draw on available cultural material, so even deeply private experience does not exist outside society’s shared stories.<\/p>"}},"bookLocation":"OPS/ch1-4.xhtml; ch1-5.xhtml; книга 1"},{"id":"greek-pivot","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Греция делает отдельного человека героем прогресса","body":"<p>В реконструкции Сторра древнегреческая культура придаёт особый вес деятельному человеку, который способен развивать себя и влиять на судьбу. Это не утверждение, что до греков не существовало личности. Речь об исторически влиятельном образце самостоятельного, соревнующегося и потенциально совершенствуемого «я», унаследованном Западом.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Greece makes the individual a protagonist of progress","body":"<p>In Storr’s reconstruction, ancient Greek culture gives special weight to an active person who can develop capacities and shape a life. This does not mean individuals did not exist before Greece. His subject is a historically influential model of an independent, competitive and potentially perfectible self inherited by the West.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"ecology-to-self","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Способ добывать средства к жизни меняет выгодный тип «я»","body":"<p>Сторр вслед за Ричардом Нисбеттом связывает греческие острова, торговлю и относительно самостоятельные занятия с привычками инициативы и спора. Когда успех требует личного решения, такая личность получает признание. Это объяснительная гипотеза о взаимодействии среды и культуры, а не географический закон, автоматически создающий характер.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Ways of making a living change which selves are rewarded","body":"<p>Following Richard Nisbett, Storr connects Greek islands, trade and relatively independent occupations with habits of initiative and argument. Where success rewards personal decisions, those habits gain prestige. This is an explanatory hypothesis about environment and culture interacting, not a geographical law that automatically manufactures a particular character in every resident.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"aristotle-potential","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Аристотелевский потенциал придаёт совершенствованию направление","body":"<p>В изложении книги природа у Аристотеля мыслится через качества вещей и реализацию их возможностей. Перенося эту рамку на человека, Сторр видит оптимистичную модель: ты можешь и должен развивать то, что способен осуществить. Позднейшее требование безграничности не следует буквально из этой ограниченной идеями своей эпохи философии.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Aristotelian potential gives improvement a direction","body":"<p>In the book’s account, Aristotle understands nature through the properties of things and the realization of their capacities. Storr reads this as an optimistic model for people: develop what you can become. The later demand for limitless potential is not a literal consequence of a philosophy bounded by its own historical assumptions.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"beautiful-and-good","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Телесное совершенство становится знаком человеческой ценности","body":"<p>Сторр связывает греческое восхищение прекрасным, деятельным телом с современным моральным оттенком внешности. Его собственное недовольство животом показывает этот перенос: форма тела переживается как недостаток воли. Это культурная интерпретация чувства стыда, а не утверждение о прямом неизменном наследовании каждого стандарта красоты.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Bodily perfection becomes a sign of human worth","body":"<p>Storr connects Greek admiration for the beautiful, capable body with the moral colouring of modern appearance. His own distress about his stomach illustrates the connection: body shape feels like a failure of will. This interprets a form of shame culturally; it does not claim that every beauty standard passed unchanged from antiquity.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"improvement-obligation","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Возможность улучшиться превращается в обязанность отвечать за всё","body":"<p>Если отдельный человек представляется главным хозяином своей судьбы, его успех легко принять за заслугу, а беду — за недостаток усилий. Сторр прослеживает эту опасную сторону полезной идеи личной активности. Между действительным влиянием на жизнь и полной ответственностью за её исходы лежит огромная дистанция.<\/p>"},"en":{"section":"2 · The perfectible self","title":"The possibility of improvement becomes an obligation to answer for everything","body":"<p>When the individual appears to be the chief master of a life, success readily looks like merit and misfortune like insufficient effort. Storr follows this dangerous side of a useful idea of personal agency. There is a large distance between having real influence over life and bearing complete responsibility for its outcomes.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"hero-plots","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Героическая история обучает ожидать управляемую жизнь","body":"<p>Герой ставит цель, преодолевает препятствия и добивается изменения. Сторр узнаёт в этом западный образ достойного человека, перенесённый в кино и личные биографии. Проблема возникает, когда сюжетная стройность принимается за обещание реальности: у случайности, болезни и чужих решений нет обязанности завершать наш рассказ справедливо.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Heroic plots teach us to expect a controllable life","body":"<p>A hero chooses a goal, overcomes obstacles and brings about change. Storr recognizes a Western model of the worthy person in films and personal biographies alike. Trouble comes when narrative order is taken as a promise about reality: chance, illness and other people’s decisions have no obligation to complete our story fairly.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"confucian-contrast","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Конфуцианский контраст делает отношения частью личности","body":"<p>Для контраста Сторр обращается к традициям, в которых достойный человек определяется отношениями, обязанностями и гармонией. Их центр тяжести — правильное участие в целом, а не выделение из него. Это сравнительная культурная рамка; она не даёт права приписывать всем китайцам одинаковые желания или отрицать индивидуальные различия.<\/p>"},"en":{"section":"2 · The perfectible self","title":"The Confucian contrast places relationships inside personhood","body":"<p>For contrast, Storr turns to traditions in which a worthy person is defined through relationships, obligations and harmony. The emphasis falls on participating properly in a whole rather than standing apart. This comparative cultural frame does not license assigning identical desires to all Chinese people or dismissing individual differences within traditions.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"object-and-context","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Привычное внимание выделяет объект или его контекст","body":"<p>Описанные Нисбеттом сравнения показывают, как участники обращают разное внимание на центральный предмет и фон. Сторр связывает это с независимым и взаимозависимым пониманием человека. Такие задачи иллюстрируют средние различия в конкретных условиях; они не измеряют ценность культур и не сортируют людей на два неизменных вида.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Habitual attention can emphasize objects or their context","body":"<p>Nisbett’s comparisons show participants attending differently to a central object and its background. Storr connects this with independent and interdependent understandings of persons. Such tasks illustrate average differences under particular conditions; they do not measure the worth of cultures or sort human beings into two fixed and mutually exclusive kinds.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"situational-attribution","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Обстоятельства исчезают, когда характер кажется всем объяснением","body":"<p>В книге сопоставляются способы объяснять жестокий поступок: чертами самого человека либо ситуацией вокруг него. Привычка видеть независимого деятеля облегчает первое объяснение. Сторр показывает цену такой оптики: можно слишком быстро превратить результат сложных условий в свидетельство о хорошей или плохой человеческой сущности.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Circumstances disappear when character seems to explain everything","body":"<p>The book compares explanations of harmful conduct through personal traits and through surrounding circumstances. Seeing an independent agent makes the first explanation easier. Storr highlights the cost of that lens: the outcome of complicated conditions can too quickly become evidence of a good or bad human essence, obscuring what the situation contributed.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"rice-within-china","level":2,"claimType":"corroboration","sources":[5],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Различия внутри Китая усложняют картину Восток—Запад","body":"<p>В исследовании Талхельма и коллег 1162 участника из шести мест в Китае различались по взаимозависимости и стилю мышления между рисовыми и пшеничными регионами. Сравнивались и соседние районы. Этот результат поддерживает роль хозяйственной среды, но прежде всего разрушает представление о едином психологическом Востоке.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Differences within China complicate the East–West picture","body":"<p>Talhelm and colleagues studied 1,162 participants across six Chinese sites, finding differences in interdependence and thought style between rice- and wheat-growing regions. Neighbouring counties were also compared. The result supports an ecological account while complicating the idea of one psychological East. It cannot establish the entire historical story of individualism.<\/p>"}}},{"id":"turkish-variation","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Соседние общины могут по-разному учить сотрудничеству","body":"<p>Сторр приводит сравнения общин черноморской Турции с разными занятиями. Они позволяют мыслить культуру мельче страны: устройство труда способно поддерживать разные повседневные привычки. Такой масштаб полезнее жёсткой национальной типологии, хотя из одного сравнения нельзя вывести универсальную формулу личности или исключить другие исторические влияния.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Neighbouring communities can teach different habits of cooperation","body":"<p>Storr discusses communities in Turkey’s Black Sea region with different occupations. They let us think about culture at a smaller scale than the nation: arrangements of work can support different everyday habits. This is more informative than a rigid national typology, although one comparison cannot produce a universal formula for personality.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"memory-self","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Воспоминание тоже организуется культурной моделью человека","body":"<p>Книга обращается к различиям автобиографического рассказа: выделять собственные чувства и решения или отношения и коллективные обстоятельства. Память здесь не просто архив фактов, а способ понимать себя. При этом обобщения о литературных традициях особенно широки: их следует читать как авторскую рамку, а не отсутствие личного опыта у целых народов.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Memory is organized through cultural models of personhood too","body":"<p>The book examines differences in autobiographical narration: emphasizing personal feelings and decisions, or relationships and collective circumstances. Memory becomes a way of understanding oneself rather than a mere factual archive. Broad claims about literary traditions need particular care; they do not imply an absence of personal experience across entire populations.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"collectivist-costs","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Коллективизм не отменяет болезненных требований","body":"<p>Сторр не предлагает Восточную Азию как лекарство от западной тревоги. Семейный долг, сохранение лица и конкуренция за достижения тоже могут давить на человека. Он обсуждает напряжение между традиционными обязательствами и быстрыми общественными переменами, признавая, что другой культурный идеал способен создавать собственные формы несоответствия.<\/p>"},"en":{"section":"2 · The perfectible self","title":"Collectivism does not abolish painful expectations","body":"<p>Storr does not offer East Asia as a cure for Western anxiety. Family duty, maintaining face and competition over achievement can also burden people. He discusses tension between inherited obligations and rapid social change, recognizing that another cultural ideal may create its own forms of painful mismatch rather than eliminate perfectionistic pressure.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"culture-not-destiny","level":3,"claimType":"synthesis","sources":[1,5],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Культурная тенденция не предсказывает отдельного человека","body":"<p>Из сравнений нельзя заключать, что конкретный житель Запада независим, а житель Востока растворён в группе. Внутри каждого общества есть различия, изменения и смешанные традиции. Полезный вопрос конспекта — какие требования вознаграждает окружение, а не к какому психологическому типу человека якобы навсегда отнесло место рождения.<\/p>"},"en":{"section":"2 · The perfectible self","title":"A cultural tendency does not predict an individual person","body":"<p>The comparisons do not establish that a particular Westerner is independent or an Easterner submerged in a group. Every society contains variation, change and mixed traditions. This digest’s useful question is which demands an environment rewards, rather than which permanent psychological type a person’s birthplace supposedly assigns them to.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"cultural-self-summary","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"2 · Совершенствуемое «я»","title":"Индивидуальное желание может быть выученным общественным правилом","body":"<p>После греческого и конфуцианского контраста Сторр возвращается к главному: представление о нормальном человеке не нейтрально. Оно делает одни способы жизни естественными, другие — подозрительными. Западный идеал деятельного совершенствования исторически влиятелен, но это одна модель человеческой ценности, а не исчерпывающее описание природы человека.<\/p>"},"en":{"section":"2 · The perfectible self","title":"A personal desire can be a learned social rule","body":"<p>After the Greek and Confucian contrast, Storr returns to his central point: a model of the normal person is not neutral. It makes some lives feel natural and others suspect. The Western ideal of active self-improvement is historically influential, but it remains one model of human worth, not an exhaustive account of human nature.<\/p>"}},"bookLocation":"OPS/ch1-6.xhtml; ch1-7.xhtml; книга 2"},{"id":"inward-turn","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Христианство переносит борьбу за совершенство внутрь","body":"<p>В интерпретации Сторра христианство не уничтожает стремление к лучшему «я», а меняет его поле: от внешней славы к чистоте души. Человек наблюдает за мыслями, желаниями и виной. Идеал становится внутренним, а потому несовершенство уже нельзя скрыть от самого себя одним достойным публичным поступком.<\/p>"},"en":{"section":"3 · The bad self","title":"Christianity turns the struggle for perfection inward","body":"<p>In Storr’s interpretation, Christianity does not abolish the quest for a better self; it changes its arena from outward glory to purity of soul. People monitor thoughts, desires and guilt. The ideal becomes internal, so a respectable public action alone cannot conceal imperfection from the person’s own inward scrutiny.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"pluscarden-laboratory","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Монастырь показывает другой распорядок достойной жизни","body":"<p>В аббатстве Пласкарден Сторр наблюдает молитву, послушание, труд и устойчивый распорядок. Он сравнивает их с собственной потребностью в признании и движении вперёд. Это журналистское погружение в конкретную бенедиктинскую общину; оно не представляет все формы христианской жизни и не служит контролируемым опытом лечения тревоги.<\/p>"},"en":{"section":"3 · The bad self","title":"The abbey reveals another timetable for a worthy life","body":"<p>At Pluscarden Abbey, Storr observes prayer, obedience, work and stable routine, comparing them with his own need for recognition and progress. This is journalistic immersion in a particular Benedictine community. It represents neither every form of Christian life nor a controlled experiment showing that monastic practice treats anxiety.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"sinful-start","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Грех меняет исходную оценку человеческой природы","body":"<p>Сторр противопоставляет раскрытие человеческих возможностей представлению о повреждённой природе, нуждающейся в спасении. В его рассказе это усиливает внутреннюю борьбу и чувство недостаточности. Формулировка сознательно широкая: различные христианские учения по-разному понимают благодать, свободу и достоинство, и книга не заменяет их историю.<\/p>"},"en":{"section":"3 · The bad self","title":"Sin changes the starting judgment of human nature","body":"<p>Storr contrasts developing human capacities with a damaged nature in need of salvation. In his account, this intensifies inward struggle and inadequacy. The formulation is deliberately broad: Christian traditions understand grace, freedom and dignity differently, and the book’s narrative cannot stand in for a detailed history of those theological differences.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"martin-belonging","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Послушание может одновременно ограничивать и поддерживать","body":"<p>Разговоры с отцом Мартином показывают, что монастырская дисциплина переживается не только как унижение. Принадлежность, служение и постоянство способны давать человеку порядок и смысл. Сторр видит в этом компромисс: система требований может быть тяжёлой, но та же система становится опорой для определённой личности.<\/p>"},"en":{"section":"3 · The bad self","title":"Obedience can constrain and sustain at the same time","body":"<p>Conversations with Father Martin show that monastic discipline is not experienced only as humiliation. Belonging, service and permanence can provide order and meaning. Storr sees a trade-off: a demanding system can be burdensome while the same system becomes a source of stability for a particular person in a particular life.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"inner-purity-inheritance","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Даже светское «я» наследует работу над внутренней чистотой","body":"<p>Сторр замечает религиозное наследие в светском внимании к внутреннему состоянию: исправить мысли, очиститься от слабости, стать достойнее. Он не утверждает тождества терапии и религии. Его ход — показать историческое родство привычки искать причину жизненной неудачи в несовершенном внутреннем мире самого человека.<\/p>"},"en":{"section":"3 · The bad self","title":"Even a secular self inherits the work of inner purification","body":"<p>Storr recognizes a religious inheritance in secular attention to inner states: correcting thoughts, removing weakness and becoming more worthy. He does not equate therapy with religion. His argument traces a historical kinship in the habit of locating the cause of life’s failures within an imperfect inner world of the person.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"reason-caveat","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"История религии сложнее противопоставления вины и разума","body":"<p>Книга обсуждает и вклад христианских традиций в рациональное толкование, учёность и представление о прогрессе. Это мешает превратить религию в простого злодея истории. Одновременно широкое сравнение религий у Сторра остаётся спорной интерпретацией: по одному выбранному акценту нельзя описать целые цивилизации.<\/p>"},"en":{"section":"3 · The bad self","title":"Religious history exceeds a contrast between guilt and reason","body":"<p>The book also discusses Christian contributions to interpretation, scholarship and ideas of progress, preventing religion from becoming a simple villain. At the same time, Storr’s broad comparisons between religions remain contestable interpretations. A selected emphasis cannot describe entire civilizations or erase their internal intellectual and spiritual diversity.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"freudian-inheritance","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Фрейд сохраняет подозрение к скрытому внутреннему человеку","body":"<p>У Фрейда внутренние конфликты получают новое объяснение: не искушение извне, а неосознаваемые желания и борьба психических сил. Сторр видит здесь продолжение старого вопроса о дурном «я» на языке психологии. Психоаналитик становится специалистом, который должен обнаружить скрытый смысл и помочь человеку с ним столкнуться.<\/p>"},"en":{"section":"3 · The bad self","title":"Freud preserves suspicion of the hidden inner person","body":"<p>With Freud, inner conflict receives another explanation: unconscious desires and competing psychological forces rather than external temptation. Storr sees an older question about the bad self continuing in psychological language. The analyst becomes the specialist expected to uncover hidden meaning and help a person confront what ordinary self-understanding cannot easily reach.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"oedipus-and-projection","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Личный сюжет легко принять за закон для всех","body":"<p>Рассказ о Фрейде и Эдипе позволяет Сторру обсуждать проекцию собственного опыта на человечество. Биографическое объяснение здесь само является интерпретацией автора, а не экспериментальным опровержением психоанализа. Более общий урок — проверить переход от убедительного рассказа об одном человеке к универсальному утверждению о людях.<\/p>"},"en":{"section":"3 · The bad self","title":"A personal story can be mistaken for a law about everyone","body":"<p>The account of Freud and Oedipus lets Storr discuss projecting personal experience onto humanity. His biographical explanation is itself an interpretation, not an experimental refutation of psychoanalysis. The broader lesson is to inspect the move from a persuasive story about one person to a universal claim about human beings.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"false-consensus","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Чужой разум не обязан повторять наш","body":"<p>Сторр обращается к склонности переоценивать, насколько окружающие разделяют наши взгляды. Эта ошибка облегчает универсальные теории и суровые оценки: если мне нечто доступно, почему другим нет? Она вернётся в финале книги, когда одинакового совершенства потребуют от людей с разными характерами и обстоятельствами.<\/p>"},"en":{"section":"3 · The bad self","title":"Other minds are not obliged to resemble ours","body":"<p>Storr considers our tendency to overestimate how much others share our views. This error makes universal theories and harsh judgments easier: if something is possible for me, why not for them? It returns in the conclusion, where identical perfection is demanded from people with different temperaments, resources and circumstances.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"perls-freud-break","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"3 · Плохое «я»","title":"Перлз готовит переворот от подозрения к освобождению","body":"<p>Сторр связывает унизительную для Фрица Перлза встречу с Фрейдом с дальнейшим отказом от прежнего авторитета. Биографическая сцена вводит следующий культурный поворот: возможно, внутреннее «я» нужно не укрощать, а освобождать. Это драматургический мост книги, а не достаточная причина возникновения целого терапевтического движения.<\/p>"},"en":{"section":"3 · The bad self","title":"Perls prepares a turn from suspicion to liberation","body":"<p>Storr connects Fritz Perls’s humiliating encounter with Freud to his later rejection of that authority. The biographical scene introduces the next cultural turn: perhaps the inner self needs liberation rather than restraint. It is a narrative bridge, not a sufficient causal explanation for the emergence of an entire therapeutic movement.<\/p>"}},"bookLocation":"OPS/ch1-8.xhtml; ch1-9.xhtml; книга 3"},{"id":"good-self-revolution","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Внутреннее «я» объявляют хорошим по природе","body":"<p>Гуманистический поворот меняет диагноз культуры: беда может быть не в дурной человеческой сущности, а в подавлении её возможностей. У Сторра это освобождающая идея с опасным продолжением. Если внутри каждого уже скрыт прекрасный потенциал, остаётся объяснить, почему обещанная жизнь так часто не наступает.<\/p>"},"en":{"section":"4 · The good self","title":"The inner self is declared good by nature","body":"<p>The humanistic turn changes the diagnosis: the problem may lie in suppressing human capacities rather than in a bad inner nature. For Storr this is a liberating idea with a dangerous extension. If a wonderful potential already exists inside everyone, one must explain why the promised life so often fails to arrive.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"rogers-relationship","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Роджерс делает принятие условием терапевтической работы","body":"<p>Карл Роджерс предлагает безусловно позитивное отношение к человеку вместо осуждения и подчинения внешнему эксперту. Сторр показывает привлекательность такого доверия. Важно не смешивать клинический принцип отношений с более широким обещанием, будто любое желание истинного «я» полезно или что принятие само по себе решит все общественные проблемы.<\/p>"},"en":{"section":"4 · The good self","title":"Rogers makes acceptance central to the therapeutic relationship","body":"<p>Carl Rogers proposes unconditional positive regard rather than condemnation and submission to an external expert. Storr shows the appeal of that trust. A therapeutic relationship principle should not be conflated with the broader promise that every desire of an authentic self is beneficial, or that acceptance alone solves all social problems.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"american-optimism","level":3,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Американский оптимизм даёт новой психологии готовый язык","body":"<p>Сторр помещает гуманистическую психологию рядом с позитивным мышлением и культурой самосоздания. Послевоенная корпоративная среда ценила общительность и уверенное поведение; личность стала частью успеха. Это историческое соседство помогает понять привлекательность нового учения, но не доказывает, что вся психология сводится к интересам бизнеса.<\/p>"},"en":{"section":"4 · The good self","title":"American optimism gives the new psychology a ready language","body":"<p>Storr places humanistic psychology alongside positive thinking and the culture of self-making. The postwar corporate environment valued sociability and confidence, making personality part of success. This historical setting helps explain the new teaching’s appeal, without establishing that all psychology merely expresses business interests or that every therapeutic benefit is illusory.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"esalen-center","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Эсален становится мастерской нового человека","body":"<p>В калифорнийском Эсалене эксперименты с группами, телом и переживаниями обещают высвободить человеческий потенциал. Через специалистов и посетителей идеи выходят за пределы института. Сторр приезжает туда не только изучать архивы: собственный опыт группы позволяет ему проверить соблазн получить новое «я» через интенсивное общение.<\/p>"},"en":{"section":"4 · The good self","title":"Esalen becomes a workshop for a new kind of person","body":"<p>At California’s Esalen, experiments with groups, the body and emotional experience promise to release human potential. Practitioners and visitors carry these ideas beyond the institute. Storr goes there to do more than study history: joining a group lets him encounter the appeal of acquiring a new self through intense interaction.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"authentic-core","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Обещание найти истинное «я» делает личность спрятанным сокровищем","body":"<p>Если социальные запреты лишь закрывают доступ к подлинной сущности, освобождение кажется возвращением к уже готовому совершенству. Сторр оспаривает этот образ. Человек складывается из нескольких склонностей и контекстных проявлений; удаление запрета ещё не гарантирует, что обнаружившийся импульс мудр, добр или полезен окружающим.<\/p>"},"en":{"section":"4 · The good self","title":"The authentic-self promise turns personality into a hidden treasure","body":"<p>If social prohibitions merely conceal an authentic essence, liberation looks like recovering a perfection already present. Storr challenges that picture. People combine competing tendencies and context-dependent expressions. Removing a prohibition does not guarantee that the impulse revealed underneath is wise, kind or useful to the other people affected by it.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"perls-confrontation","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Жёсткая откровенность может стать новым подчинением","body":"<p>Сторр описывает резкие методы Перлза и других лидеров встреч, где нападение на участника оправдывалось разрушением его защиты. Декларируемая свобода соседствовала с властью ведущего. Критика касается конкретных практик и исторических эпизодов; её нельзя автоматически переносить на любую групповую терапию или современный институт.<\/p>"},"en":{"section":"4 · The good self","title":"Confrontational honesty can become another form of submission","body":"<p>Storr describes harsh methods used by Perls and other encounter leaders, with attacks justified as breaking down defences. Promised freedom coexisted with the facilitator’s authority. The criticism concerns particular practices and historical episodes; it should not automatically be applied to every group therapy or to the present-day institution as a whole.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"social-mirror","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Группа может внушить человеку, кто он такой","body":"<p>Если окружающие настойчиво называют участника фальшивым, слабым или неприятным, он может принять этот образ за открывшуюся истину. Для Сторра это обратная сторона социального «я». Среда не просто снимает маску: она способна создавать ту идентичность, которую затем выдаёт за обнаруженную под ней сущность.<\/p>"},"en":{"section":"4 · The good self","title":"A group can persuade a person who they are","body":"<p>When others repeatedly label someone false, weak or unpleasant, the person may accept that image as a newly revealed truth. Storr sees this as the social self’s vulnerability. A group does not merely remove a mask; it can produce the identity it then presents as an authentic essence discovered underneath.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"ostracism-pain","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Отвержение переживается как серьёзная угроза","body":"<p>Книга обращается к исследованиям остракизма и социальной боли, объясняя, почему слова группы способны так ранить. Сторр связывает это с зависимостью от принадлежности. При этом сходство отдельных нейронных реакций не делает социальное отвержение и физическую травму полностью одинаковыми явлениями и не объясняет каждый клинический исход.<\/p>"},"en":{"section":"4 · The good self","title":"Exclusion is experienced as a serious threat","body":"<p>The book draws on research into ostracism and social pain to explain why a group’s words can wound so deeply. Storr connects this with dependence on belonging. Similarities in some neural responses do not make social exclusion and physical injury identical, however, or explain every clinical outcome following a painful social experience.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"total-responsibility","level":1,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Безграничный потенциал делает неудачу личной виной","body":"<p>Если внутри человека будто бы есть всё необходимое для успеха, препятствия легко объявить его собственным сопротивлением. Так обещание силы превращается в обвинение: раз не получилось, недостаточно открылся или захотел. Сторр показывает, как из освобождающей терапии может вырасти жестокое требование единолично отвечать за свою жизнь.<\/p>"},"en":{"section":"4 · The good self","title":"Unlimited potential makes failure a personal fault","body":"<p>If a person supposedly contains everything necessary for success, obstacles can be reclassified as personal resistance. Empowerment becomes accusation: failure means not wanting or opening up enough. Storr shows how a liberating therapeutic ideal can grow into a harsh demand that individuals alone answer for everything that happens in their lives.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"tragedies-caution","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Исторические трагедии требуют осторожной причинности","body":"<p>Сторр рассказывает о смертях людей, связанных с эсаленским движением, и тревоге внутри него. Он прямо оговаривает несправедливость автоматического обвинения института. Эти эпизоды ставят вопросы о безопасности и ответственности, но сами по себе не показывают частоту риска, контрольную группу или единственную причину трагедии.<\/p>"},"en":{"section":"4 · The good self","title":"Historical tragedies require careful causal reasoning","body":"<p>Storr recounts deaths among people connected with the Esalen movement and concerns within it. He explicitly cautions against automatically blaming the institute. These episodes raise questions about safety and responsibility, but do not by themselves establish a risk rate, provide a control group or identify a single cause of each tragedy.<\/p>"}},"bookLocation":"OPS/ch1-10.xhtml; ch1-11.xhtml; ch1-12.xhtml; книга 4"},{"id":"authors-doubts","level":2,"claimType":"book","sources":[1],"copy":{"ru":{"section":"4 · Хорошее «я»","title":"Создатели движения тоже замечали его издержки","body":"<p>Поздние сомнения Маслоу и Роджерса нарушают картину единодушных гуру. Сторр приводит их тревогу о самомнении, недостатке дисциплины и последствиях практик. Это важная внутренняя критика: гуманистический поворот нельзя описать только его крайностями, а осторожность не всегда приходила исключительно от внешних противников.<\/p>"},"en":{"section":"4 · The goo
