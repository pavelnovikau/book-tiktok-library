free product against a free product that already has a community and a brand.<\/p><div class=\"fact\"><span class=\"fact-label\">Our estimate<\/span><p>The place to win is where Nous is weaker: control, audit and transparency for companies.<\/p><\/div>"}},{"id":"options","level":1,"sources":[16],"ru":{"section":"VIII · Что это значит для нас","title":"У нас четыре варианта следующего шага","html":"<ul class=\"story-list\"><li><span class=\"index\">A<\/span><div><strong>Пульт для Hermes<\/strong><span>Observatory как панель, аудит, подтверждения и биллинг для флота агентов.<\/span><\/div><\/li><li><span class=\"index\">B<\/span><div><strong>Внедрение под ключ<\/strong><span>Cybergizer разворачивает Hermes у клиентов. Быстрые деньги, не продукт.<\/span><\/div><\/li><li><span class=\"index\">C<\/span><div><strong>Hermes как движок<\/strong><span>Наши боты на ядре Hermes, наше — сверху. Экономим на коннекторах.<\/span><\/div><\/li><li><span class=\"index\">D<\/span><div><strong>Свой аналог<\/strong><span>Ещё один агент. Не рекомендуем.<\/span><\/div><\/li><\/ul>"},"en":{"section":"VIII · What it means for us","title":"We have four options for the next step","html":"<ul class=\"story-list\"><li><span class=\"index\">A<\/span><div><strong>A console for Hermes<\/strong><span>Observatory as dashboard, audit, approvals and billing for an agent fleet.<\/span><\/div><\/li><li><span class=\"index\">B<\/span><div><strong>Turnkey deployment<\/strong><span>Cybergizer rolls out Hermes for clients. Quick money, not a product.<\/span><\/div><\/li><li><span class=\"index\">C<\/span><div><strong>Hermes as the engine<\/strong><span>Our bots on the Hermes core, our layer on top. Saves building connectors.<\/span><\/div><\/li><li><span class=\"index\">D<\/span><div><strong>Our own clone<\/strong><span>Yet another agent. Not recommended.<\/span><\/div><\/li><\/ul>"}},{"id":"recommend","level":1,"sources":[16],"ru":{"section":"VIII · Что это значит для нас","title":"Рекомендация: C как спайк и A как тест спроса","html":"<div class=\"compare\"><div class=\"compare-item\"><h2>C · 1–2 дня<\/h2><p>Поднять Hermes на тестовом сервере и сравнить с нашими ботами.<\/p><\/div><div class=\"compare-item\"><h2>A · параллельно<\/h2><p>Проверить, купят ли компании пульт для флота агентов.<\/p><\/div><\/div><p>B — если до конца года нужны деньги. D — нет.<\/p><p class=\"muted\">Наша оценка.<\/p>"},"en":{"section":"VIII · What it means for us","title":"Recommendation: C as a spike and A as a demand test","html":"<div class=\"compare\"><div class=\"compare-item\"><h2>C · 1–2 days<\/h2><p>Stand up Hermes on a test server and compare it with our bots.<\/p><\/div><div class=\"compare-item\"><h2>A · in parallel<\/h2><p>Check whether companies will buy a console for their agent fleet.<\/p><\/div><\/div><p>B — if we need money before year end. D — no.<\/p><p class=\"muted\">Our estimate.<\/p>"}},{"id":"test-a","level":2,"sources":[16],"ru":{"section":"VIII · Что это значит для нас","title":"Тест варианта A — одна интеграция, лендинг и 20 писем","html":"<p class=\"lede\">Покупатель — CTO или руководитель ops в компании на 20–200 человек, которая раздала агентов сотрудникам и не понимает, что они делают и сколько стоят.<\/p><ul class=\"story-list\"><li><span class=\"index\">01<\/span><div><strong>Интеграция<\/strong><span>Читать логи и сессии Hermes.<\/span><\/div><\/li><li><span class=\"index\">02<\/span><div><strong>Лендинг<\/strong><span>Обещание: видно каждое действие агента.<\/span><\/div><\/li><li><span class=\"index\">03<\/span><div><strong>20 писем<\/strong><span>Целевым CTO — считаем ответы.<\/span><\/div><\/li><\/ul>"},"en":{"section":"VIII · What it means for us","title":"Testing option A takes one integration, a landing page and 20 emails","html":"<p class=\"lede\">The buyer is a CTO or head of ops at a 20–200-person company that has handed agents to staff and can’t tell what they do or what they cost.<\/p><ul class=\"story-list\"><li><span class=\"index\">01<\/span><div><strong>Integration<\/strong><span>Read Hermes logs and sessions.<\/span><\/div><\/li><li><span class=\"index\">02<\/span><div><strong>Landing page<\/strong><span>The promise: every agent action is visible.<\/span><\/div><\/li><li><span class=\"index\">03<\/span><div><strong>20 emails<\/strong><span>To target CTOs — we count the replies.<\/span><\/div><\/li><\/ul>"}},{"id":"unknowns","level":3,"sources":[16,4,14],"ru":{"section":"VIII · Что это значит для нас","title":"Три вещи мы пока не знаем","html":"<ul class=\"story-list\"><li><span class=\"index\">01<\/span><div><strong>Цены Business и Enterprise<\/strong><span>Не опубликованы.<\/span><\/div><\/li><li><span class=\"index\">02<\/span><div><strong>Логи и хранилище Hermes<\/strong><span>Можно ли читать их снаружи — от этого зависит вариант A.<\/span><\/div><\/li><li><span class=\"index\">03<\/span><div><strong>Надёжность в командах<\/strong><span>Независимых кейсов нет.<\/span><\/div><\/li><\/ul><p class=\"muted\">Первый пункт закрывается письмом в Nous, второй — спайком C, третий — только временем.<\/p>"},"en":{"section":"VIII · What it means for us","title":"There are three things we don’t know yet","html":"<ul class=\"story-list\"><li><span class=\"index\">01<\/span><div><strong>Business and Enterprise prices<\/strong><span>Not published.<\/span><\/div><\/li><li><span class=\"index\">02<\/span><div><strong>Hermes logs and storage<\/strong><span>Whether they can be read from outside — option A depends on it.<\/span><\/div><\/li><li><span class=\"index\">03<\/span><div><strong>Reliability in teams<\/strong><span>No independent case studies.<\/span><\/div><\/li><\/ul><p class=\"muted\">The first is one email to Nous, the second is the C spike, the third only time will tell.<\/p>"}},{"id":"risk-c","level":3,"sources":[16,3],"ru":{"section":"VIII · Что это значит для нас","title":"Цена варианта C — зависимость от чужого ядра","html":"<p class=\"lede\">Переехав на Hermes, мы экономим на коннекторах Slack, WhatsApp и Discord — но наше ядро начинает меняться по чужому графику.<\/p><div class=\"compare\"><div class=\"compare-item\"><h2>Выигрыш<\/h2><p>20+ каналов, skills, сообщество, бесплатные обновления.<\/p><\/div><div class=\"compare-item\"><h2>Риск<\/h2><p>Миграция, ломающие изменения, 5000+ issue в чужом трекере.<\/p><\/div><\/div><p class=\"muted\">Поэтому сначала однодневный спайк, а не переезд. Наша оценка.<\/p>"},"en":{"section":"VIII · What it means for us","title":"The price of option C is depending on someone else’s core","html":"<p class=\"lede\">Moving to Hermes saves us building Slack, WhatsApp and Discord connectors — but our core starts changing on someone else’s schedule.<\/p><div class=\"compare\"><div class=\"compare-item\"><h2>Gain<\/h2><p>20+ channels, skills, community, free updates.<\/p><\/div><div class=\"compare-item\"><h2>Risk<\/h2><p>Migration, breaking changes, 5000+ issues in someone else’s tracker.<\/p><\/div><\/div><p class=\"muted\">Hence a one-day spike first, not a move. Our estimate.<\/p>"}},{"id":"nous-panel","level":2,"sources":[4,16],"ru":{"section":"VIII · Что это значит для нас","title":"Главный риск варианта A — Nous сделает свою панель","html":"<p class=\"lede\">Управление уже продаётся в Hermes for Businesses: лимиты, общие skills, SSO. Следующий логичный шаг — дашборд флота.<\/p><div class=\"fact\"><span class=\"fact-label\">Как защищаться · наша оценка<\/span><p>Быть мульти-вендорным: Hermes и Claude-агенты в одной панели. Плюс то, что вендору делать невыгодно: независимый аудит каждого чтения личных данных, подтверждения кнопкой администратора, пиры между серверами.<\/p><\/div>"},"en":{"section":"VIII · What it means for us","title":"The main risk to option A is Nous building its own dashboard","html":"<p class=\"lede\">Control is already sold in Hermes for Businesses: limits, shared skills, SSO. The logical next step is a fleet dashboard.<\/p><div class=\"fact\"><span class=\"fact-label\">How to defend · our estimate<\/span><p>Be multi-vendor: Hermes and Claude agents in one console. Plus what a vendor has no reason to build: independent audit of every personal-data read, admin button approvals, peers between servers.<\/p><\/div>"}},{"id":"final","level":1,"sources":[16,9,3,2],"final":true,"ru":{"section":"Финал","title":"Три факта и один вывод, которые стоит унести с собой","html":"<div class=\"fact\"><span class=\"fact-label\">Nous<\/span><p>Открытая лаборатория из Discord: бесплатные модели и агент, около $158M привлечено, оценка $1,5 млрд — по данным прессы.<\/p><\/div><div class=\"fact\"><span class=\"fact-label\">Hermes Agent<\/span><p>Зеркало нашего стека с огромным сообществом — но без панели флота, аудита и журнала действий.<\/p><\/div><div class=\"fact\"><span class=\"fact-label\">Мы<\/span><p>Спайк C на 1–2 дня и тест спроса A: интеграция, лендинг, 20 писем.<\/p><\/div><p class=\"lede\"><strong>Не строить ещё одного агента — построить пульт для чужих.<\/strong><\/p>"},"en":{"section":"Finale","title":"Three facts and one conclusion worth taking with you","html":"<div class=\"fact\"><span class=\"fact-label\">Nous<\/span><p>An open lab born on Discord: free models and agent, about $158M raised, valued at $1.5B — per press reports.<\/p><\/div><div class=\"fact\"><span class=\"fact-label\">Hermes Agent<\/span><p>A mirror of our stack with a huge community — but no fleet dashboard, audit or action log.<\/p><\/div><div class=\"fact\"><span class=\"fact-label\">Us<\/span><p>A 1–2-day C spike and an A demand test: integration, landing page, 20 emails.<\/p><\/div><p class=\"lede\"><strong>Don’t build yet another agent — build the console for everyone else’s.<\/strong><\/p>"}}]}</script>
<script>
/* TikTokBook runtime — book-agnostic; all content comes from #book-data. */
(function () {
  'use strict';

  var BOOK = JSON.parse(document.getElementById('book-data').textContent);
  var SLIDES = BOOK.slides;
  var MODES = ['short', 'core', 'deep'];
  var LEVELS = { short: 1, core: 2, deep: 3 };
  var KEY = BOOK.storageKey;

  var UI = {
    ru: {
      shell: 'Книга-сторис', progress: 'Прогресс чтения', modeGroup: 'Глубина чтения',
      library: 'К библиотеке', libraryLabel: 'Вернуться в библиотеку',
      start: 'Начать', continueFrom: 'Продолжить с «{title}»', startOver: 'Начать заново',
      next: 'Дальше', back: 'Назад', restart: 'Сначала', counter: '{n} / {total}',
      screens: '{n} экранов', contents: 'Главы', sources: 'Источники', close: 'Закрыть',
      sourcesLink: 'Источники: {list}', legalTitle: 'О методе', sourcesTitle: 'Источники',
      creditsTitle: 'Изображения', noImages: 'Изображений нет: обложка типографская.',
      langButton: 'EN', langLabel: 'Switch to English',
      themeToLight: 'Светлая', themeToDark: 'Тёмная', themeLabel: 'Сменить тему',
      screenOf: 'Экран {n} из {total}'
    },
    en: {
      shell: 'Story book', progress: 'Reading progress', modeGroup: 'Reading depth',
      library: 'Back to library', libraryLabel: 'Return to the library',
      start: 'Start', continueFrom: 'Continue from “{title}”', startOver: 'Start over',
      next: 'Next', back: 'Back', restart: 'Restart', counter: '{n} / {total}',
      screens: '{n} screens', contents: 'Contents', sources: 'Sources', close: 'Close',
      sourcesLink: 'Sources: {list}', legalTitle: 'About the method', sourcesTitle: 'Sources',
      creditsTitle: 'Images', noImages: 'No images: the cover is typographic.',
      langButton: 'RU', langLabel: 'Переключить на русский',
      themeToLight: 'Light', themeToDark: 'Dark', themeLabel: 'Toggle theme',
      screenOf: 'Screen {n} of {total}'
    }
  };

  function load(name) {
    try { return window.localStorage.getItem(KEY + '.' + name); } catch (e) { return null; }
  }
  function save(name, value) {
    try {
      if (value === null) window.localStorage.removeItem(KEY + '.' + name);
      else window.localStorage.setItem(KEY + '.' + name, value);
    } catch (e) { /* private mode / file:// */ }
  }
  function pick(value, allowed, fallback) {
    return allowed.indexOf(value) >= 0 ? value : fallback;
  }

  var state = {
    mode: pick(load('mode'), MODES, BOOK.defaultMode),
    position: 0,
    direction: 0,
    theme: pick(load('theme'), ['dark', 'light'], BOOK.defaultTheme),
    language: pick(load('language'), BOOK.languages, BOOK.defaultLanguage)
  };

  var el = {
    root: document.documentElement,
    progress: document.getElementById('progress'),
    story: document.getElementById('story'),
    nav: document.getElementById('nav'),
    back: document.getElementById('btn-back'),
    next: document.getElementById('btn-next'),
    counter: document.getElementById('counter'),
    library: document.getElementById('btn-library'),
    contents: document.getElementById('btn-contents'),
    sources: document.getElementById('btn-sources'),
    lang: document.getElementById('btn-lang'),
    theme: document.getElementById('btn-theme'),
    shell: document.getElementById('shell'),
    dlgContents: document.getElementById('dlg-contents'),
    dlgSources: document.getElementById('dlg-sources'),
    toc: document.getElementById('toc'),
    sourcesBody: document.getElementById('sources-body'),
    themeMeta: document.querySelector('meta[name="theme-color"]')
  };

  function t(key, vars) {
    var over = BOOK.ui && BOOK.ui[state.language];
    var s = (over && over[key]) || UI[state.language][key] || UI.en[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    }
    return s;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function meta() { return BOOK.meta[state.language]; }
  function copy(slide) { return slide[state.language] || slide[BOOK.defaultLanguage] || {}; }
  function titleOf(slide) { return slide.cover ? meta().title : copy(slide).title; }
  function visible() {
    var limit = LEVELS[state.mode];
    return SLIDES.filter(function (s) { return s.level <= limit; });
  }
  function current() { return visible()[state.position]; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function findSlide(id) {
    for (var i = 0; i < SLIDES.length; i++) if (SLIDES[i].id === id) return SLIDES[i];
    return null;
  }
  function resumeSlide() {
    var s = findSlide(load('lastSlide'));
    return s && !s.cover ? s : null;
  }
  function dialogOpen() {
    return el.dlgContents.hasAttribute('open') || el.dlgSources.hasAttribute('open');
  }

  /* Rendering */
  function renderCover() {
    var m = meta();
    var resume = resumeSlide();
    var title = esc(m.title).replace(/ &amp; /g, ' <span class="cover-amp">&amp;</span> ');
    var modes = MODES.map(function (mode) {
      var info = BOOK.modes[mode][state.language];
      var count = SLIDES.filter(function (s) { return s.level <= LEVELS[mode]; }).length;
      return '<button type="button" class="mode-btn" data-mode="' + mode + '" aria-pressed="' +
        (mode === state.mode) + '" title="' + esc(t('screens', { n: count })) + '">' +
        '<span class="mode-label">' + esc(info.label) + '</span>' +
        '<span class="mode-time">' + esc(info.time) + '</span></button>';
    }).join('');
    var primary = resume
      ? '<button type="button" class="btn-primary" data-action="resume">' + esc(t('continueFrom', { title: titleOf(resume) })) + '</button>' +
        '<button type="button" class="btn-secondary" data-action="start">' + esc(t('startOver')) + '</button>'
      : '<button type="button" class="btn-primary" data-action="start">' + esc(t('start')) + '</button>';
    return '<article class="slide cover">' +
      '<p class="kicker">' + esc(m.tagline) + '</p>' +
      '<h1 class="cover-title">' + title + '</h1>' +
      '<hr class="cover-rule">' +
      '<p class="cover-subtitle">' + esc(m.subtitle) + '</p>' +
      '<p class="cover-author">' + esc(m.author) + '</p>' +
      '<p class="cover-desc muted">' + esc(m.description) + '</p>' +
      '<div class="cover-actions">' +
      '<div class="mode-picker" role="group" aria-label="' + esc(t('modeGroup')) + '">' + modes + '</div>' +
      primary + '</div></article>';
  }

  function renderSlide(slide) {
    var c = copy(slide);
    return '<article class="slide' + (slide.final ? ' is-final' : '') + '">' +
      '<p class="kicker">' + esc(c.section) + '</p>' +
      '<h1 class="slide-title">' + esc(c.title) + '</h1>' +
      '<div class="slide-body">' + c.html + '</div>' +
      '<button type="button" class="source-link" data-action="sources" data-cite="' + slide.sources.join(',') + '">' +
      esc(t('sourcesLink', { list: slide.sources.join(', ') })) + '</button>' +
      '</article>';
  }

  function render() {
    var list = visible();
    if (state.position < 0) state.position = 0;
    if (state.position > list.length - 1) state.position = list.length - 1;
    var slide = list[state.position];
    var m = meta();

    el.root.lang = state.language;
    document.title = m.title + ' — ' + m.tagline;
    el.shell.setAttribute('aria-label', t('shell') + ': ' + m.title);

    var segs = '';
    for (var i = 0; i < list.length; i++) {
      segs += '<span class="progress-seg' + (i < state.position ? ' is-done' : i === state.position ? ' is-current' : '') + '"></span>';
    }
    el.progress.innerHTML = segs;
    el.progress.setAttribute('aria-label', t('progress'));
    el.progress.setAttribute('aria-valuemax', String(list.length));
    el.progress.setAttribute('aria-valuenow', String(state.position + 1));
    el.progress.setAttribute('aria-valuetext', t('screenOf', { n: state.position + 1, total: list.length }));

    el.story.innerHTML = slide.cover ? renderCover() : renderSlide(slide);
    var art = el.story.firstChild;
    if (state.direction) art.classList.add(state.direction > 0 ? 'enter-next' : 'enter-prev');
    el.story.scrollTop = 0;

    el.nav.hidden = !!slide.cover;
    el.nav.setAttribute('aria-label', t('progress'));
    el.library.setAttribute('aria-label', t('libraryLabel'));
    el.library.setAttribute('title', t('library'));
    el.back.textContent = t('back');
    el.back.disabled = state.position === 0;
    el.next.textContent = state.position === list.length - 1 ? t('restart') : t('next');
    el.counter.textContent = t('counter', { n: state.position + 1, total: list.length });

    el.contents.textContent = t('contents');
    el.sources.textContent = t('sources');
    el.lang.textContent = t('langButton');
    el.lang.setAttribute('aria-label', t('langLabel'));
    el.theme.textContent = state.theme === 'dark' ? t('themeToLight') : t('themeToDark');
    el.theme.setAttribute('aria-label', t('themeLabel'));
    document.querySelectorAll('[data-action="close"]').forEach(function (b) { b.textContent = t('close'); });
    document.getElementById('dlg-contents-title').textContent = t('contents');
    document.getElementById('dlg-sources-title').textContent = t('sourcesTitle');

    if (!slide.cover) save('lastSlide', slide.id);
    state.direction = 0;
  }

  function applyTheme() {
    el.root.setAttribute('data-theme', state.theme);
    if (el.themeMeta) {
      var bg = window.getComputedStyle(el.root).getPropertyValue('--color-bg').trim();
      if (bg) el.themeMeta.setAttribute('content', bg);
    }
  }

  /* Navigation */
  function go(delta) {
    var list = visible();
    if (delta > 0 && state.position >= list.length - 1) {
      save('lastSlide', null);
      state.position = 0;
      state.direction = -1;
    } else {
      var p = Math.max(0, Math.min(list.length - 1, state.position + delta));
      if (p === state.position) return;
      state.direction = delta > 0 ? 1 : -1;
      state.position = p;
    }
    render();
    if (state.position === 0) focusStory();
  }

  function jumpTo(id) {
    var slide = findSlide(id);
    if (!slide) return;
    if (slide.level > LEVELS[state.mode]) {
      for (var i = 0; i < MODES.length; i++) {
        if (LEVELS[MODES[i]] >= slide.level) { state.mode = MODES[i]; break; }
      }
      save('mode', state.mode);
    }
    var list = visible();
    var target = list.indexOf(slide);
    state.direction = target >= state.position ? 1 : -1;
    state.position = target;
    render();
  }

  function setMode(mode) {
    state.mode = mode;
    save('mode', mode);
    state.position = 0;
    state.direction = 0;
    render();
    var btn = el.story.querySelector('[data-mode="' + mode + '"]');
    if (btn) btn.focus();
  }

  function focusStory() {
    var b = el.story.querySelector('.btn-primary');
    if (b) b.focus({ preventScroll: true });
  }

  /* Dialogs */
  function openDialog(dlg) {
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open', '');
  }
  function closeDialog(dlg) {
    if (typeof dlg.close === 'function') dlg.close();
    else dlg.removeAttribute('open');
  }

  function openContents() {
    var list = visible();
    var cur = current();
    var lastSection = null;
    el.toc.innerHTML = list.map(function (s, i) {
      var section = s.cover ? '' : copy(s).section.split(' · ')[0];
      var head = '';
      if (section && section !== lastSection) head = '<span class="toc-section">' + esc(section) + '</span>';
      lastSection = section || lastSection;
      return '<li>' + head + '<button type="button" data-jump="' + esc(s.id) + '"' +
        (s === cur ? ' aria-current="true"' : '') + '><span class="toc-index">' + pad(i + 1) +
        '</span><span>' + esc(titleOf(s)) + '</span></button></li>';
    }).join('');
    openDialog(el.dlgContents);
    var active = el.toc.querySelector('[aria-current="true"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'center' });
  }

  function openSources(cite) {
    var lang = state.language;
    var cited = cite ? String(cite).split(',').map(Number) : [];
    var items = BOOK.sources.map(function (src, i) {
      var n = i + 1;
      return '<li id="src-' + n + '"' + (cited.indexOf(n) >= 0 ? ' class="is-cited"' : '') + '>' +
        '<span class="toc-index">' + pad(n) + '</span><span>' +
        (src.url ? '<a href="' + esc(src.url) + '" target="_blank" rel="noreferrer">' + esc(src.title) + '</a>'
                 : '<strong>' + esc(src.title) + '</strong>') +
        '<span class="src-note">' + esc(src.note[lang]) + '</span></span></li>';
    }).join('');
    var imgs = BOOK.images || {};
    var credits = Object.keys(imgs).map(function (k) {
      var im = imgs[k];
      return esc(im.credit[lang]) + (im.license ? ' — ' + esc(im.license) : '');
    });
    el.sourcesBody.innerHTML =
      '<h3>' + esc(t('legalTitle')) + '</h3><p class="legal">' + esc(BOOK.legal[lang]) + '</p>' +
      '<h3>' + esc(t('sourcesTitle')) + '</h3><ol class="src-list">' + items + '</ol>' +
      '<h3>' + esc(t('creditsTitle')) + '</h3><p class="credits">' +
      (credits.length ? credits.join('<br>') : esc(t('noImages'))) + '</p>';
    openDialog(el.dlgSources);
    el.sourcesBody.scrollTop = 0;
    if (cited.length) {
      var first = document.getElementById('src-' + cited[0]);
      if (first && first.scrollIntoView) first.scrollIntoView({ block: 'nearest' });
    }
  }

  /* Events */
  document.addEventListener('click', function (e) {
    var target = e.target;
    if (target === el.dlgContents || target === el.dlgSources) { closeDialog(target); return; }
    var mode = target.closest('[data-mode]');
    if (mode) { setMode(mode.getAttribute('data-mode')); return; }
    var jump = target.closest('[data-jump]');
    if (jump) { closeDialog(el.dlgContents); jumpTo(jump.getAttribute('data-jump')); return; }
    var btn = target.closest('[data-action]');
    if (!btn) return;
    switch (btn.getAttribute('data-action')) {
      case 'next': go(1); break;
      case 'back': go(-1); break;
      case 'start':
        save('lastSlide', null);
        state.position = 0; go(1); break;
      case 'resume': var r = resumeSlide(); if (r) jumpTo(r.id); else go(1); break;
      case 'contents': openContents(); break;
      case 'sources': openSources(btn.getAttribute('data-cite')); break;
      case 'close': closeDialog(btn.closest('dialog')); break;
      case 'language':
        state.language = state.language === 'ru' ? 'en' : 'ru';
        if (BOOK.languages.indexOf(state.language) < 0) state.language = BOOK.defaultLanguage;
        save('language', state.language);
        render(); break;
      case 'theme':
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        save('theme', state.theme);
        applyTheme(); render(); break;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (dialogOpen() || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = e.target && e.target.tagName;
    var onControl = tag === 'BUTTON' || tag === 'A' || tag === 'INPUT';
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !onControl)) {
      e.preventDefault(); go(1);
    } else if (k === 'ArrowLeft' || k === 'PageUp') {
      e.preventDefault(); go(-1);
    }
  });

  var touch = null;
  el.story.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touch = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  el.story.addEventListener('pointerup', function (e) {
    if (!touch || touch.id !== e.pointerId || dialogOpen()) { touch = null; return; }
    var dx = e.clientX - touch.x;
    var dy = e.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) >= 52 && Math.abs(dx) > 1.25 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });
  el.story.addEventListener('pointercancel', function () { touch = null; });

  applyTheme();
  render();
})();
</script>

  <!-- book-library-focus:start -->
  <script id="book-library-focus-script">
    (function () {
      'use strict';
      var root = document.documentElement;
      var story = document.getElementById('story');
      if (!story) return;
      var key = 'bookFocusMode:' + location.pathname;
      var tap = null;

      function stored() {
        try { return sessionStorage.getItem(key) === 'true'; } catch (_) { return false; }
      }

      function setFocus(enabled) {
        if (enabled) root.setAttribute('data-focus-mode', 'true');
        else root.removeAttribute('data-focus-mode');
        try { sessionStorage.setItem(key, enabled ? 'true' : 'false'); } catch (_) {}
      }

      function isInteractive(target) {
        return Boolean(target && target.closest('a, button, input, textarea, select, summary, details, dialog, [role="button"], [contenteditable="true"]'));
      }

      function hasSelection() {
        var selection = window.getSelection && window.getSelection();
        return Boolean(selection && !selection.isCollapsed && String(selection).trim());
      }

      setFocus(stored());

      story.addEventListener('pointerdown', function (event) {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        if (isInteractive(event.target)) return;
        tap = { id: event.pointerId, x: event.clientX, y: event.clientY, time: Date.now() };
      }, true);

      story.addEventListener('pointerup', function (event) {
        if (!tap || tap.id !== event.pointerId) { tap = null; return; }
        var dx = event.clientX - tap.x;
        var dy = event.clientY - tap.y;
        var elapsed = Date.now() - tap.time;
        tap = null;
        if (Math.hypot(dx, dy) > 12 || elapsed > 550 || hasSelection() || isInteractive(event.target)) return;
        setFocus(root.getAttribute('data-focus-mode') !== 'true');
      }, true);

      story.addEventListener('pointercancel', function () { tap = null; }, true);
      document.addEventListener('keydown', function (event) {
        if (isInteractive(event.target) || document.querySelector('dialog[open]')) return;
        if ((event.key === 'f' || event.key === 'F' || event.key === 'а' || event.key === 'А') && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          setFocus(root.getAttribute('data-focus-mode') !== 'true');
        } else if (event.key === 'Escape' && root.getAttribute('data-focus-mode') === 'true') {
          setFocus(false);
        }
      });
    }());
  </script>
  <!-- book-library-focus:end -->
</body>
