<!-- book-reader-header:start -->
<style id="book-reader-header-style">
  :root {
    --header-icon-size: 18px;
    --header-control-size: 36px;
    --reader-safe-top: env(safe-area-inset-top, 0px);
    --reader-safe-right: env(safe-area-inset-right, 0px);
    --reader-safe-left: env(safe-area-inset-left, 0px);
  }
  /* black-translucent iOS standalone overlays the viewport. Reserve its inset
     above the same compact row; otherwise all icons can sit under the status bar. */
  html .app-header,
  html header.topbar {
    padding: calc(var(--space-2, 0.5rem) + var(--reader-safe-top))
      max(var(--space-3, 0.75rem), var(--reader-safe-right))
      var(--space-2, 0.5rem)
      max(var(--space-3, 0.75rem), var(--reader-safe-left));
  }
  html[data-content-mode="narrative"] .source-label { display: none; }
  html .topbar,
  html .topbar-group { gap: var(--space-1, 0.25rem); flex-wrap: nowrap !important; }
  html .topbar button,
  html .topbar #libraryButton,
  html .topbar #btn-library {
    display: inline-flex;
    flex: 0 0 var(--header-control-size);
    align-items: center;
    justify-content: center;
    width: var(--header-control-size);
    min-width: var(--header-control-size);
    height: var(--header-control-size);
    min-height: var(--header-control-size);
    padding: 0;
    margin: 0;
    line-height: 1;
  }
  html .topbar [data-reader-icon] {
    width: var(--header-icon-size);
    height: var(--header-icon-size);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }
  html .topbar #bookLibraryInstallTrigger {
    position: static;
    inset: auto;
    transform: none;
    box-shadow: none;
    margin: 0;
  }
  html .topbar #bookLibraryInstallTrigger[hidden],
  html[data-focus-mode="true"] .book-library-install-trigger,
  html[data-focus-mode="true"] .book-library-install-dialog { display: none !important; }
</style>
<script id="book-reader-header-script">
(function () {
  'use strict';
  var root = document.documentElement;
  var bar = document.querySelector('.topbar');
  if (!bar) return;
  var embedded = document.getElementById('book-tiktok-data');
  if (embedded) {
    try {
      var mode = JSON.parse(embedded.textContent).contentMode;
      if (mode === 'narrative' || mode === 'explanatory') root.dataset.contentMode = mode;
    } catch (_) {} // Legacy readers keep their existing presentation.
  }
  var paths = {
    home: '<path d="M3 10 12 3l9 7v10H15v-6H9v6H3z"/>',
    chapters: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    language: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18M12 3c-5 5-5 13 0 18"/>',
    sources: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
    light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
    dark: '<path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14z"/>',
    install: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 10h6M12 7v6M11 18h2"/>'
  };
  var labels = {
    ru: { home: 'К библиотеке', chapters: 'Главы', language: 'Switch to English', sources: 'Источники', light: 'Светлая тема', dark: 'Тёмная тема', install: 'На экран «Домой»: инструкция' },
    en: { home: 'Back to library', chapters: 'Chapters', language: 'Переключить на русский', sources: 'Sources', light: 'Light theme', dark: 'Dark theme', install: 'Add to Home Screen: instructions' }
  };
  var controls = [
    ['#libraryButton, #btn-library', 'home'],
    ['#contentsButton, #btn-contents', 'chapters'],
    ['#languageButton, #btn-lang', 'language'],
    ['#sourcesButton, #btn-sources', 'sources'],
    ['#themeButton, #btn-theme', 'theme'],
    ['#bookLibraryInstallTrigger', 'install']
  ];
  var trigger = document.getElementById('bookLibraryInstallTrigger');
  if (trigger) (bar.querySelector('.topbar-group:last-child') || bar).append(trigger);

  function update() {
    var copy = labels[String(root.lang).toLowerCase().indexOf('en') === 0 ? 'en' : 'ru'];
    controls.forEach(function (entry) {
      var node = document.querySelector(entry[0]);
      if (!node) return;
      var name = entry[1] === 'theme' ? (root.dataset.theme === 'dark' ? 'light' : 'dark') : entry[1];
      if (!node.querySelector('svg[data-reader-icon="' + name + '"]') || node.textContent.trim()) {
        node.innerHTML = '<svg data-reader-icon="' + name + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + paths[name] + '</svg>';
      }
      if (node.getAttribute('aria-label') !== copy[name]) node.setAttribute('aria-label', copy[name]);
      if (node.title !== copy[name]) node.title = copy[name];
    });
  }
  update();
  new MutationObserver(update).observe(root, { attributes: true, attributeFilter: ['lang', 'data-theme'] });
  new MutationObserver(update).observe(bar, { childList: true, subtree: true });
}());
</script>
<!-- book-reader-header:end -->
